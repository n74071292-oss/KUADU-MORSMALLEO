<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuaducode Studio - Pro Text Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="brand-header">
  <div class="brand-logo">
    <div class="logo-icon">⚡</div>
    <span>Kuaducode Studio</span>
  </div>
  <div class="owner-badge">
    <div class="owner-dot"></div>
    Owner: Kuaducode Workspace
  </div>
</div>

<div class="menubar">
  <div class="menu-dropdown" id="menuFile">File
    <div class="dropdown-content">
      <div class="dropdown-item" id="menuNew"><span>New File</span><span>Ctrl+N</span></div>
      <div class="dropdown-item" id="menuOpen"><span>Open...</span><span>Ctrl+O</span></div>
      <div class="dropdown-item" id="menuSave"><span>Save</span><span>Ctrl+S</span></div>
      <div class="dropdown-divider"></div>
      <div class="dropdown-item" id="menuClear"><span>Clear Content</span></div>
    </div>
  </div>
  <div class="menu-dropdown" id="menuEdit">Edit
    <div class="dropdown-content">
      <div class="dropdown-item" id="menuSelectAll"><span>Select All</span><span>Ctrl+A</span></div>
    </div>
  </div>
  <div class="menu-dropdown" id="menuSettingsTab">Settings
    <div class="dropdown-content">
      <div class="dropdown-item" id="menuOpenSettings"><span>Editor Preferences...</span><span>⚙️</span></div>
    </div>
  </div>
</div>

<div class="tab-bar" id="tabBar">
  <button class="add-tab-btn" id="addTabBtn" title="New Tab (Ctrl+T)">＋</button>
</div>

<div class="toolbar">
  <div class="toolbar-group">
    <button id="newTabBtn">📄 New Tab</button>
    <label class="upload-btn">
      📂 Import <input type="file" id="fileInput" accept=".txt,.md,.html,.js,.css,.py">
    </label>
    <button class="primary-btn" id="saveBtn">💾 Save File</button>
  </div>
  <div class="toolbar-group">
    <button id="settingsBtn">⚙️ Settings</button>
  </div>
</div>

<div class="editor-container">
  <div id="lineNumbers" class="line-numbers">1</div>
  <textarea id="textArea" placeholder="// Welcome to Kuaducode Studio Pro&#10;// Start typing your code or notes here..."></textarea>
</div>

<div id="settingsModal" class="modal-overlay">
  <div class="modal">
    <h3>⚙️ Editor Preferences</h3>
    
    <div class="setting-item">
      <label for="langSelect">Language Mode:</label>
      <select id="langSelect">
        <option value="plaintext">Plain Text</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
      </select>
    </div>

    <div class="setting-item">
      <label for="fontSizeRange">Font Size: <span id="fontSizeVal">14</span>px</label>
      <input type="range" id="fontSizeRange" min="12" max="24" value="14">
    </div>

    <div class="setting-item">
      <label for="textColorPicker">Text Color:</label>
      <input type="color" id="textColorPicker" value="#f3f4f6">
    </div>

    <div class="setting-row">
      <input type="checkbox" id="lineNumToggle" checked>
      <label for="lineNumToggle">Show Line Numbers</label>
    </div>

    <div class="setting-row">
      <input type="checkbox" id="wordWrapToggle" checked>
      <label for="wordWrapToggle">Enable Word Wrap</label>
    </div>

    <button class="modal-close" id="closeSettings">Save & Close</button>
  </div>
</div>

<div class="status-bar">
  <div class="status-group">
    <span class="pulse-badge"><span class="owner-dot"></span> Kuaducode Active</span>
    <span id="langDisplay">Lang: Plain Text</span>
  </div>
  <div class="status-group">
    <span id="wordCount">Words: 0</span>
    <span id="charCount">Chars: 0</span>
    <span id="cursorPos">Ln 1, Col 1</span>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
