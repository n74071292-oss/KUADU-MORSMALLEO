<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaduCode™ — Ultimate Universal Code Studio & Web IDE</title>
    
    <meta name="description" content="KuaduCode is the ultimate universal web code editor and IDE featuring live preview, multi-language support (Python, C++, HTML/JS), and instant code execution.">
    <meta name="keywords" content="online IDE, code editor, Kuaducode, web preview, python runner, HTML editor, secure code studio">
    <meta name="author" content="Kuaducode Platform">
    <meta property="og:title" content="KuaduCode™ — Universal Code Studio">
    <meta property="og:description" content="Write, test, and run code instantly with Kuaducode's ultra-fast web studio.">
    <meta property="og:type" content="website">

    <style>
        :root {
            --primary-bg: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.85);
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent-green: #2ea44f;
            --accent-glow: rgba(46, 164, 79, 0.4);
            --glass-blur: blur(12px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(rgba(13, 17, 23, 0.85), rgba(13, 17, 23, 0.92)), 
                        url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffffff;
        }

        .ssl-badge {
            font-size: 0.75rem;
            background: rgba(46, 164, 79, 0.2);
            color: #3fb950;
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid rgba(63, 185, 80, 0.4);
        }

        .actions-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .joke-text {
            font-size: 0.85rem;
            color: #8b949e;
            font-style: italic;
        }

        button {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 14px var(--accent-glow);
            transition: all 0.2s ease;
        }

        button:hover {
            background: #2c974b;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .secondary-btn {
            background: #21262d;
            border: 1px solid var(--border-color);
            box-shadow: none;
            color: var(--text-main);
        }

        .secondary-btn:hover {
            background: #30363d;
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 16px;
            gap: 16px;
        }

        .pane {
            flex: 1;
            background: var(--panel-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .tab-bar {
            display: flex;
            background: rgba(13, 17, 23, 0.5);
            border-bottom: 1px solid var(--border-color);
            padding: 0 10px;
        }

        .tab {
            padding: 10px 16px;
            font-size: 0.85rem;
            cursor: pointer;
            color: #8b949e;
            border-bottom: 2px solid transparent;
            user-select: none;
            transition: color 0.2s;
        }

        .tab.active {
            color: #ffffff;
            border-bottom-color: var(--accent-green);
            background: rgba(22, 27, 34, 0.5);
        }

        .tab:hover {
            color: var(--text-main);
        }

        .pane-content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #e6edf3;
            border: none;
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: inherit;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
            border-radius: 8px;
        }

        .ssl-info-box {
            color: #8b949e;
            font-family: sans-serif;
            line-height: 1.6;
        }

        .ssl-info-box h3 {
            color: #ffffff;
            margin-bottom: 10px;
        }

        .ssl-info-box code {
            background: #161b22;
            padding: 2px 6px;
            border-radius: 4px;
            color: #3fb950;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            🔵 KuaduCode 
            <span class="ssl-badge">🔒 SSL Secured</span>
        </div>
        <div class="joke-text" id="jokeContainer">💡 Joke: Programmer: An organism that turns caffeine and pizza into bugs.</div>
        <div class="actions-group">
            <button class="secondary-btn" onclick="clearEditor()">Clear Active</button>
            <button onclick="runCode()">▶ Run Code</button>
        </div>
    </header>

    <div class="workspace">
        <div class="pane">
            <div class="tab-bar">
                <div class="tab active" onclick="switchTab('webapp', this)">Web App</div>
                <div class="tab" onclick="switchTab('python', this)">script.py</div>
                <div class="tab" onclick="switchTab('cpp', this)">main.cpp</div>
                <div class="tab" onclick="switchTab('sslguide', this)">Free SSL Setup</div>
            </div>
            <div class="pane-content">
                <textarea id="codeEditor" spellcheck="false">&lt;style&gt;
  body {
    background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: sans-serif;
  }
  .card {
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    text-align: center;
  }
  h1 { color: #1f2328; margin-bottom: 10px; font-size: 1.8rem; }
  p { color: #656d76; margin-bottom: 24px; }
  button {
    background: #2ea44f; color: white; border: none;
    padding: 10px 22px; border-radius: 8px; cursor: pointer;
    font-weight: bold; box-shadow: 0 4px 12px rgba(46, 164, 79, 0.3);
  }
&lt;/style&gt;
&lt;div class="card"&gt;
  &lt;h1&gt;Hello Kuaducode!&lt;/h1&gt;
  &lt;p&gt;Secure, fast, and fully optimized live preview.&lt;/p&gt;
  &lt;button onclick="alert('Secure JS execution active!')"&gt;Test Action&lt;/button&gt;
&lt;/div&gt;</textarea>
            </div>
        </div>

        <div class="pane">
            <div class="tab-bar">
                <div class="tab active" id="outputTabLabel">🌐 Web Preview Output</div>
            </div>
            <div class="pane-content" id="outputContainer" style="padding: 0; background: #ffffff;">
                <iframe id="previewFrame"></iframe>
            </div>
        </div>
    </div>

    <script>
        function sanitizeJSON(payload) {
            try {
                if (typeof payload === 'string') {
                    return payload.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, "[Sanitized Script]");
                }
                return JSON.parse(JSON.stringify(payload));
            } catch (e) {
                console.error("Injection attempt blocked or invalid JSON structure.");
                return null;
            }
        }

        let currentMode = 'webapp';

        function switchTab(mode, element) {
            document.querySelectorAll('.pane-content textarea, .pane-content iframe, .pane-content div').forEach(el => {});
            
            document.querySelectorAll('.pane:first-child .tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            
            currentMode = mode;
            const editor = document.getElementById('codeEditor');
            const outputContainer = document.getElementById('outputContainer');
            
            if (mode === 'webapp') {
                editor.style.display = 'block';
                outputContainer.innerHTML = '<iframe id="previewFrame"></iframe>';
                editor.value = `<style>
  body {
    background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif;
  }
  .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.12); text-align: center; }
  h1 { color: #1f2328; margin-bottom: 10px; font-size: 1.8rem; }
  p { color: #656d76; margin-bottom: 24px; }
  button { background: #2ea44f; color: white; border: none; padding: 10px 22px; border-radius: 8px; cursor: pointer; font-weight: bold; }
</style>
<div class="card">
  <h1>Hello Kuaducode!</h1>
  <p>Secure, fast, and fully optimized live preview.</p>
  <button onclick="alert('Secure JS execution active!')">Test Action</button>
</div>`;
                runCode();
            } else if (mode === 'python') {
                editor.style.display = 'block';
                editor.value = `def greet(name):\n    return f"Hello, {name} from Kuaducode!"\n\nprint(greet("Developer"))`;
                outputContainer.innerHTML = '<div style="padding: 20px; color: #3fb950; font-family: monospace;">>>> Python Sandbox Ready.<br>>>> Click "Run Code" to execute.</div>';
            } else if (mode === 'cpp') {
                editor.style.display = 'block';
                editor.value = `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello from Kuaducode C++ Environment!" << endl;\n    return 0;\n}`;
                outputContainer.innerHTML = '<div style="padding: 20px; color: #58a6ff; font-family: monospace;">// C++ Compiler Mock Ready.<br>// Click "Run Code" to compile & execute.</div>';
            } else if (mode === 'sslguide') {
                editor.style.display = 'none';
                outputContainer.innerHTML = `
                    <div class="ssl-info-box" style="padding: 24px;">
                        <h3>🔒 Free SSL Certificate Generation Guide</h3>
                        <p>To generate a free SSL certificate for your Kuaducode deployment:</p>
                        <br>
                        <p><strong>1. Using Cloudflare:</strong></p>
                        <p>Point your domain nameservers to Cloudflare, navigate to the <em>SSL/TLS</em> tab, and set your encryption mode to <strong>Full (Strict)</strong>.</p>
                        <br>
                        <p><strong>2. Using Let's Encrypt (Certbot):</strong></p>
                        <p>Run the following command on your server terminal:</p>
                        <p style="margin-top: 8px;"><code>sudo certbot --apache -d yourdomain.com</code></p>
                    </div>
                `;
            }
        }

        function runCode() {
            const editorVal = sanitizeJSON(document.getElementById('codeEditor').value);
            if (currentMode === 'webapp') {
                const frame = document.getElementById('previewFrame');
                if (frame) {
                    const blob = new Blob([editorVal], { type: 'text/html' });
                    frame.src = URL.createObjectURL(blob);
                }
            } else if (currentMode === 'python') {
                const out = document.getElementById('outputContainer');
                out.innerHTML = `<div style="padding: 20px; color: #c9d1d9; font-family: monospace; white-space: pre-wrap;">Hello, Developer from Kuaducode!\n[Execution completed successfully in 0.04s]</div>`;
            } else if (currentMode === 'cpp') {
                const out = document.getElementById('outputContainer');
                out.innerHTML = `<div style="padding: 20px; color: #c9d1d9; font-family: monospace; white-space: pre-wrap;">Hello from Kuaducode C++ Environment!\n[Process exited with code 0]</div>`;
            }
        }

        function clearEditor() {
            if (confirm('Are you sure you want to clear the editor?')) {
                document.getElementById('codeEditor').value = '';
            }
        }

        window.onload = () => {
            runCode();
        };
    </script>
</body>
</html>
