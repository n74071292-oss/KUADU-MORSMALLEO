<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaduCode™ — Modern Multi-Language Professional IDE</title>
    <!-- Pyodide for Python execution in browser -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <!-- sql.js for SQL execution in browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        :root {
            --bg-deep: #07090e;
            --bg-dark: #0b0f19;
            --bg-panel: #131c2e;
            --bg-panel-hover: #1b2640;
            --border-color: #1e293b;
            --border-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            --success: #34d399;
            --danger: #f87171;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Sleek Modern Header */
        header {
            background-color: var(--bg-dark);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent-gradient);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.4);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(1px);
        }

        button.clear-btn {
            background: #1e293b;
            color: var(--text-muted);
            box-shadow: none;
            border: 1px solid var(--border-color);
        }

        button.clear-btn:hover {
            background: #273449;
            color: var(--text-main);
            box-shadow: none;
        }

        /* Main Workspace Grid */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            gap: 12px;
            padding: 12px;
            background-color: var(--bg-deep);
            overflow: hidden;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            overflow: hidden;
        }

        .panel {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: border-color 0.25s ease;
        }

        .panel:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }

        .panel-header {
            background-color: var(--bg-panel);
            padding: 10px 16px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-header .badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.2);
            text-transform: none;
            font-weight: 500;
        }

        .editor-container {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            background-color: #070a12;
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: transparent;
            color: #e2e8f0;
            border: none;
            padding: 14px;
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', Courier, monospace;
            font-size: 0.875rem;
            resize: none;
            outline: none;
            line-height: 1.6;
            tab-size: 4;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .console-output {
            flex: 1;
            background-color: #070a12;
            color: #38bdf8;
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', Courier, monospace;
            padding: 14px;
            overflow-y: auto;
            font-size: 0.85rem;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .console-output.error {
            color: var(--danger);
        }

        .console-output.success {
            color: var(--success);
        }

        /* Modern Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* SQL Result Table Styling */
        table.sql-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 4px;
            font-size: 0.825rem;
        }

        table.sql-table th, table.sql-table td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }

        table.sql-table th {
            background-color: var(--bg-panel);
            color: var(--text-main);
            font-weight: 600;
        }

        table.sql-table tr:hover td {
            background-color: rgba(56, 189, 248, 0.05);
        }

        @media (max-width: 1100px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                overflow-y: auto;
            }
            body {
                overflow: auto;
            }
            .column {
                height: 600px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">K</div>
            <span>KuaduCode</span>™ IDE
        </div>
        <div class="toolbar">
            <button class="clear-btn" onclick="clearAll()">Clear All</button>
            <button onclick="runAll()">▶ Run Web & Code</button>
        </div>
    </header>

    <div class="main-container">
        <!-- LEFT COLUMN: Code Editors -->
        <div class="column">
            <!-- HTML / CSS / JS Editor Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span>HTML / CSS / JS Source</span>
                    <span class="badge">Live View Ready</span>
                </div>
                <div class="editor-container">
                    <textarea id="html-editor" placeholder="Write HTML/CSS/JS here...">&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;style&gt;
    body { 
      font-family: 'Inter', sans-serif; 
      text-align: center; 
      padding-top: 40px; 
      background: linear-gradient(135deg, #f0fdf4, #dcfce7); 
      color: #166534; 
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; }
    p { font-size: 0.95rem; opacity: 0.8; }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;✨ KuaduCode™ Live Engine Active&lt;/h1&gt;
  &lt;p&gt;Modify markup to see instant changes.&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>
                </div>
            </div>

            <!-- Python Editor Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span>Python 3 Workspace</span>
                    <button style="padding: 3px 10px; font-size: 0.75rem;" onclick="runPython()">Run Python ▶</button>
                </div>
                <div class="editor-container">
                    <textarea id="python-editor" placeholder="# Write Python code here...">import math

radius = 6
area = math.pi * (radius ** 2)
print(f"Calculated circle area for r={radius}: {round(area, 2)}")</textarea>
                </div>
            </div>

            <!-- SQL Editor Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span>SQL Workspace (SQLite)</span>
                    <button style="padding: 3px 10px; font-size: 0.75rem;" onclick="runSQL()">Run SQL Query ▶</button>
                </div>
                <div class="editor-container">
                    <textarea id="sql-editor" placeholder="-- Write SQL queries here...">CREATE TABLE projects (id INTEGER PRIMARY KEY, name TEXT, status TEXT);
INSERT INTO projects VALUES (1, 'KuaduCode IDE', 'Active');
INSERT INTO projects VALUES (2, 'Cloud Sync', 'In Progress');

SELECT * FROM projects;</textarea>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Previews & Consoles -->
        <div class="column">
            <!-- Live Preview Panel -->
            <div class="panel" style="flex: 1.6;">
                <div class="panel-header">
                    <span>Live Web View</span>
                    <span class="badge">Realtime</span>
                </div>
                <iframe id="live-preview"></iframe>
            </div>

            <!-- Python Output Panel -->
            <div class="panel" style="flex: 1;">
                <div class="panel-header">
                    <span>Python Console Output</span>
                    <span id="py-status" class="badge">Initializing...</span>
                </div>
                <div id="python-console" class="console-output">Loading Pyodide runtime environment...</div>
            </div>

            <!-- SQL Output Panel -->
            <div class="panel" style="flex: 1;">
                <div class="panel-header">
                    <span>SQL Query Result</span>
                    <span id="sql-status" class="badge">Initializing...</span>
                </div>
                <div id="sql-console" class="console-output">Loading SQLite WASM engine...</div>
            </div>
        </div>
    </div>

    <script>
        const htmlEditor = document.getElementById('html-editor');
        const livePreview = document.getElementById('live-preview');

        function updatePreview() {
            const code = htmlEditor.value;
            const blob = new Blob([code], { type: 'text/html' });
            livePreview.src = URL.createObjectURL(blob);
        }

        htmlEditor.addEventListener('input', updatePreview);
        window.addEventListener('DOMContentLoaded', updatePreview);

        function runAll() {
            updatePreview();
            runPython();
            runSQL();
        }

        function clearAll() {
            if(confirm("Clear all editors and consoles?")) {
                document.getElementById('html-editor').value = "";
                document.getElementById('python-editor').value = "";
                document.getElementById('sql-editor').value = "";
                updatePreview();
                document.getElementById('python-console').innerText = "Cleared.";
                document.getElementById('sql-console').innerText = "Cleared.";
            }
        }

        // --- Python Engine Setup ---
        let pyodideReady = false;
        let pyodideInstance = null;

        async function initPython() {
            const consoleEl = document.getElementById('python-console');
            const statusEl = document.getElementById('py-status');
            try {
                pyodideInstance = await loadPyodide();
                pyodideReady = true;
                statusEl.innerText = "Ready";
                statusEl.style.color = "var(--success)";
                statusEl.style.borderColor = "rgba(52, 211, 153, 0.3)";
                statusEl.style.background = "rgba(52, 211, 153, 0.1)";
                consoleEl.innerText = "Python environment ready. Click 'Run Python' to execute.";
            } catch (err) {
                statusEl.innerText = "Error";
                statusEl.style.color = "var(--danger)";
                consoleEl.className = "console-output error";
                consoleEl.innerText = "Failed to load Python: " + err.message;
            }
        }

        async function runPython() {
            const consoleEl = document.getElementById('python-console');
            if (!pyodideReady) {
                consoleEl.innerText = "Python engine is still loading...";
                return;
            }

            consoleEl.className = "console-output";
            consoleEl.innerText = "Executing python code...";
            let code = document.getElementById('python-editor').value;

            try {
                pyodideInstance.runPython(`
                    import sys
                    import io
                    sys.stdout = io.StringIO()
                `);

                await pyodideInstance.loadPackagesFromImports(code);
                await pyodideInstance.runPythonAsync(code);

                let stdout = pyodideInstance.runPython("sys.stdout.getvalue()");
                consoleEl.innerText = stdout || "Executed successfully with no output.";
            } catch (err) {
                consoleEl.className = "console-output error";
                consoleEl.innerText = err.message;
            }
        }

        // --- SQL Engine Setup ---
        let db = null;

        async function initSQL() {
            const consoleEl = document.getElementById('sql-console');
            const statusEl = document.getElementById('sql-status');
            try {
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });
                db = new SQL.Database();
                statusEl.innerText = "Ready";
                statusEl.style.color = "var(--success)";
                statusEl.style.borderColor = "rgba(52, 211, 153, 0.3)";
                statusEl.style.background = "rgba(52, 211, 153, 0.1)";
                consoleEl.innerText = "SQL engine ready. Click 'Run SQL Query' to execute.";
            } catch (err) {
                statusEl.innerText = "Error";
                statusEl.style.color = "var(--danger)";
                consoleEl.className = "console-output error";
                consoleEl.innerText = "Failed to load SQL engine: " + err.message;
            }
        }

        function runSQL() {
            const consoleEl = document.getElementById('sql-console');
            if (!db) {
                consoleEl.innerText = "SQL engine is still loading...";
                return;
            }

            consoleEl.className = "console-output";
            const query = document.getElementById('sql-editor').value;

            try {
                const results = db.exec(query);
                if (results.length === 0) {
                    consoleEl.innerText = "Query executed successfully.";
                    return;
                }

                let htmlOutput = "";
                results.forEach(res => {
                    let table = '<table class="sql-table"><thead><tr>';
                    res.columns.forEach(col => table += `<th>${col}</th>`);
                    table += '</tr></thead><tbody>';

                    res.values.forEach(row => {
                        table += '<tr>';
                        row.forEach(val => table += `<td>${val !== null ? val : 'NULL'}</td>`);
                        table += '</tr>';
                    });
                    table += '</tbody></table>';
                    htmlOutput += table + "<br>";
                });

                consoleEl.innerHTML = htmlOutput;
            } catch (err) {
                consoleEl.className = "console-output error";
                consoleEl.innerText = err.message;
            }
        }

        initPython();
        initSQL();
    </script>
</body>
</html>
