<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaduCode™ — Modern Multi-Language Professional IDE</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        :root {
            --bg-deep: rgba(241, 245, 249, 0.85);
            --bg-dark: rgba(255, 255, 255, 0.92);
            --bg-panel: rgba(248, 250, 252, 0.95);
            --bg-panel-hover: #f1f5f9;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7;
            --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            --success: #059669;
            --danger: #dc2626;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            /* Gorgeous bright professional background image with a soft light overlay */
            background: linear-gradient(rgba(248, 250, 252, 0.88), rgba(241, 245, 249, 0.92)), 
                        url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-dark);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent-gradient);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.3);
        }

        .logo span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
            filter: brightness(1.05);
        }

        button:active {
            transform: translateY(1px);
        }

        button.clear-btn {
            background: rgba(226, 232, 240, 0.8);
            color: var(--text-muted);
            box-shadow: none;
            border: 1px solid var(--border-color);
        }

        button.clear-btn:hover {
            background: #cbd5e1;
            color: var(--text-main);
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            gap: 12px;
            padding: 12px;
            overflow: hidden;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
            overflow: hidden;
        }

        .panel {
            background-color: var(--bg-dark);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .panel-header {
            background-color: var(--bg-panel);
            padding: 10px 16px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-header .badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(14, 165, 233, 0.1);
            color: var(--accent);
            border: 1px solid rgba(14, 165, 233, 0.2);
            text-transform: none;
            font-weight: 500;
        }

        .tab-header {
            background-color: var(--bg-panel);
            padding: 0 12px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            gap: 4px;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            box-shadow: none;
            border-radius: 0;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(0, 0, 0, 0.02);
            transform: none;
            box-shadow: none;
            filter: none;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(14, 165, 233, 0.05);
        }

        .tab-content {
            display: none;
            flex: 1;
            position: relative;
            overflow: hidden;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        .editor-container {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            background-color: rgba(255, 255, 255, 0.5);
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: transparent;
            color: #1e293b;
            border: none;
            padding: 14px;
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', Courier, monospace;
            font-size: 0.875rem;
            resize: none;
            outline: none;
            line-height: 1.6;
            tab-size: 4;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .console-wrapper {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .console-output {
            flex: 1;
            color: #0369a1;
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', Courier, monospace;
            padding: 14px;
            overflow-y: auto;
            font-size: 0.85rem;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .console-output.error {
            color: var(--danger);
        }

        .console-output.success {
            color: var(--success);
        }

        .console-input-bar {
            display: flex;
            border-top: 1px solid var(--border-color);
            background: var(--bg-dark);
            padding: 8px;
            gap: 8px;
        }

        .console-input-bar input {
            flex: 1;
            background: rgba(241, 245, 249, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-main);
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            outline: none;
        }

        .console-input-bar input:focus {
            border-color: var(--accent);
        }

        .console-input-bar button {
            padding: 6px 14px;
            font-size: 0.8rem;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        table.sql-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 4px;
            font-size: 0.825rem;
        }

        table.sql-table th, table.sql-table td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }

        table.sql-table th {
            background-color: var(--bg-panel);
            color: var(--text-main);
            font-weight: 600;
        }

        table.sql-table tr:hover td {
            background-color: rgba(14, 165, 233, 0.05);
        }

        @media (max-width: 1100px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
                overflow-y: auto;
            }
            body {
                overflow: auto;
            }
            .column {
                height: 550px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon">K</div>
            <span>KuaduCode</span>™ IDE
        </div>
        <div class="toolbar">
            <button class="clear-btn" onclick="clearAll()">Clear All</button>
            <button onclick="runAll()">▶ Run All Environments</button>
        </div>
    </header>

    <div class="main-container">
        <div class="column">
            <div class="panel">
                <div class="panel-header">
                    <span>HTML / CSS / JS Source</span>
                    <span class="badge">Live View Ready</span>
                </div>
                <div class="editor-container">
                    <textarea id="html-editor" placeholder="Write HTML/CSS/JS here..."></textarea>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span>Python 3 Workspace</span>
                    <button style="padding: 3px 10px; font-size: 0.75rem;" onclick="runPython()">Run Python ▶</button>
                </div>
                <div class="editor-container">
                    <textarea id="python-editor" placeholder="# Write Python code here... e.g. name = input('Your name: ')"></textarea>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span>SQL Workspace (SQLite)</span>
                    <button style="padding: 3px 10px; font-size: 0.75rem;" onclick="runSQL()">Run SQL Query ▶</button>
                </div>
                <div class="editor-container">
                    <textarea id="sql-editor" placeholder="-- Write SQL queries here..."></textarea>
                </div>
            </div>
        </div>

        <div class="column">
            <div class="panel" style="flex: 1;">
                <div class="tab-header">
                    <button class="tab-btn active" onclick="switchTab('preview', this)">🌐 Live Web View</button>
                    <button class="tab-btn" onclick="switchTab('python', this)">🐍 Python Console <span id="py-status" style="font-size:0.65rem; color:var(--success);">●</span></button>
                    <button class="tab-btn" onclick="switchTab('sql', this)">🗄️ SQL Results <span id="sql-status" style="font-size:0.65rem; color:var(--success);">●</span></button>
                </div>

                <div id="tab-preview" class="tab-content active">
                    <iframe id="live-preview"></iframe>
                </div>

                <div id="tab-python" class="tab-content">
                    <div class="console-wrapper">
                        <div id="python-console" class="console-output">Loading Pyodide runtime environment...</div>
                        <div class="console-input-bar">
                            <input type="text" id="python-input" placeholder="Type input here when prompted..." onkeydown="handlePythonInputKey(event)">
                            <button onclick="submitPythonInput()">Send Input</button>
                        </div>
                    </div>
                </div>

                <div id="tab-sql" class="tab-content">
                    <div class="console-wrapper">
                        <div id="sql-console" class="console-output">Loading SQLite WASM engine...</div>
                        <div class="console-input-bar">
                            <input type="text" id="sql-input" placeholder="Type quick SQL query here..." onkeydown="handleSQLInputKey(event)">
                            <button onclick="submitSQLInput()">Execute</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const htmlEditor = document.getElementById('html-editor');
        const livePreview = document.getElementById('live-preview');

        function updatePreview() {
            const code = htmlEditor.value;
            const blob = new Blob([code], { type: 'text/html' });
            livePreview.src = URL.createObjectURL(blob);
        }

        htmlEditor.addEventListener('input', updatePreview);
        window.addEventListener('DOMContentLoaded', updatePreview);

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            btnElement.classList.add('active');
        }

        function runAll() {
            updatePreview();
            runPython();
            runSQL();
        }

        function clearAll() {
            if(confirm("Clear all editors and consoles?")) {
                document.getElementById('html-editor').value = "";
                document.getElementById('python-editor').value = "";
                document.getElementById('sql-editor').value = "";
                updatePreview();
                document.getElementById('python-console').innerText = "Cleared.";
                document.getElementById('sql-console').innerText = "Cleared.";
            }
        }

        let pyodideReady = false;
        let pyodideInstance = null;
        let pythonInputResolve = null;

        async function initPython() {
            const consoleEl = document.getElementById('python-console');
            const statusEl = document.getElementById('py-status');
            try {
                pyodideInstance = await loadPyodide();
                pyodideReady = true;
                statusEl.style.color = "var(--success)";
                consoleEl.innerText = "Python environment ready. Click 'Run Python' to execute.";
            } catch (err) {
                statusEl.style.color = "var(--danger)";
                consoleEl.className = "console-output error";
                consoleEl.innerText = "Failed to load Python: " + err.message;
            }
        }

        function customInput(promptText = "") {
            return new Promise((resolve) => {
                const consoleEl = document.getElementById('python-console');
                if (promptText) {
                    consoleEl.innerText += promptText;
                }
                pythonInputResolve = resolve;
                const inputField = document.getElementById('python-input');
                inputField.focus();
            });
        }

        function submitPythonInput() {
            const inputField = document.getElementById('python-input');
            const val = inputField.value;
            inputField.value = "";

            const consoleEl = document.getElementById('python-console');
            consoleEl.innerText += val + "\n";
            consoleEl.scrollTop = consoleEl.scrollHeight;

            if (pythonInputResolve) {
                const resolve = pythonInputResolve;
                pythonInputResolve = null;
                resolve(val);
            }
        }

        function handlePythonInputKey(event) {
            if (event.key === 'Enter') {
                submitPythonInput();
            }
        }

        async function runPython() {
            const consoleEl = document.getElementById('python-console');
            if (!pyodideReady) {
                consoleEl.innerText = "Python engine is still loading...";
                return;
            }

            consoleEl.className = "console-output";
            consoleEl.innerText = "Executing python code...\n";
            let code = document.getElementById('python-editor').value;

            try {
                pyodideInstance.setStdout({
                    batched: (msg) => {
                        consoleEl.innerText += msg + "\n";
                        consoleEl.scrollTop = consoleEl.scrollHeight;
                    }
                });

                pyodideInstance.setStdin({
                    stdin: () => {
                        return customInput();
                    }
                });

                await pyodideInstance.loadPackagesFromImports(code);
                await pyodideInstance.runPythonAsync(code);
                consoleEl.innerText += "\n[Execution completed successfully]\n";
                consoleEl.scrollTop = consoleEl.scrollHeight;
            } catch (err) {
                consoleEl.className = "console-output error";
                consoleEl.innerText += "\n" + err.message;
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }
        }

        let db = null;

        async function initSQL() {
            const consoleEl = document.getElementById('sql-console');
            const statusEl = document.getElementById('sql-status');
            try {
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });
                db = new SQL.Database();
                statusEl.style.color = "var(--success)";
                consoleEl.innerText = "SQL engine ready. Enter queries below or use workspace editor.";
            } catch (err) {
                statusEl.style.color = "var(--danger)";
                consoleEl.className = "console-output error";
                consoleEl.innerText = "Failed to load SQL engine: " + err.message;
            }
        }

        function executeSQLQuery(query) {
            const consoleEl = document.getElementById('sql-console');
            if (!db) {
                consoleEl.innerText = "SQL engine is still loading...";
                return;
            }

            consoleEl.className = "console-output";

            try {
                const results = db.exec(query);
                if (results.length === 0) {
                    consoleEl.innerText = "Query executed successfully with no result set.";
                    return;
                }

                let htmlOutput = "";
                results.forEach(res => {
                    let table = '<table class="sql-table"><thead><tr>';
                    res.columns.forEach(col => table += `<th>${col}</th>`);
                    table += '</tr></thead><tbody>';

                    res.values.forEach(row => {
                        table += '<tr>';
                        row.forEach(val => table += `<td>${val !== null ? val : 'NULL'}</td>`);
                        table += '</tr>';
                    });
                    table += '</tbody></table>';
                    htmlOutput += table + "<br>";
                });

                consoleEl.innerHTML = htmlOutput;
            } catch (err) {
                consoleEl.className = "console-output error";
                consoleEl.innerText = err.message;
            }
        }

        function runSQL() {
            const query = document.getElementById('sql-editor').value;
            executeSQLQuery(query);
        }

        function submitSQLInput() {
            const inputField = document.getElementById('sql-input');
            const val = inputField.value.trim();
            if (!val) return;
            inputField.value = "";
            document.getElementById('sql-editor').value = val;
            executeSQLQuery(val);
        }

        function handleSQLInputKey(event) {
            if (event.key === 'Enter') {
                submitSQLInput();
            }
        }

        initPython();
        initSQL();
    </script>
</body>
</html>
