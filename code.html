<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaduCode — Professional Multi-Language IDE & Code Runner</title>
    <style>
        :root {
            --bg-base: #090a0f;
            --bg-surface: #12151c;
            --bg-elevated: #1a1e29;
            --border-color: #272d3d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #8b5cf6;
            --accent-hover: #7c3aed;
            --accent-success: #10b981;
            --accent-gold: #f59e0b;
            --accent-pink: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-surface);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-pink));
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--text-main);
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .header-badge {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: var(--bg-elevated);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-tabs {
            display: flex;
            background-color: var(--bg-surface);
            padding: 10px 20px;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: thin;
        }

        .lang-tabs::-webkit-scrollbar {
            height: 4px;
        }

        .lang-tabs::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .tab-btn {
            background-color: var(--bg-elevated);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background-color: #252b3b;
            color: var(--text-main);
            border-color: #3b4252;
        }

        .tab-btn.active {
            background-color: var(--accent-primary);
            color: #ffffff;
            border-color: var(--accent-primary);
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.4);
        }

        .tab-btn.premium {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-pink));
            color: #fff;
            border: none;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(236, 72, 153, 0.3);
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            background-color: var(--bg-base);
            gap: 12px;
            padding: 12px;
            overflow: hidden;
        }

        .pane {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .pane-header {
            background-color: var(--bg-elevated);
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
        }

        .run-btn {
            background-color: var(--accent-success);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.3);
        }

        .run-btn:hover {
            background-color: #059669;
            transform: translateY(-1px);
        }

        textarea {
            flex: 1;
            background-color: var(--bg-surface);
            color: var(--text-main);
            border: none;
            padding: 18px;
            resize: none;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            outline: none;
            line-height: 1.6;
            tab-size: 4;
        }

        .output-container {
            flex: 1;
            background-color: #050608;
            color: #34d399;
            padding: 18px;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        iframe {
            flex: 1;
            border: none;
            background-color: #ffffff;
        }

        .premium-dashboard {
            grid-column: span 2;
            padding: 40px;
            overflow-y: auto;
            background-color: var(--bg-surface);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .premium-hero {
            text-align: center;
            max-width: 700px;
            margin-bottom: 40px;
        }

        .premium-hero h2 {
            color: var(--accent-pink);
            font-size: 2.2rem;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .premium-hero p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .pricing-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 40px;
        }

        .price-card {
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .price-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-pink);
        }

        .price-card h3 {
            color: var(--text-main);
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .price-amount {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-success);
            margin-bottom: 18px;
        }

        .price-features {
            list-style: none;
            margin-bottom: 28px;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .price-features li::before {
            content: "✓ ";
            color: var(--accent-success);
            font-weight: bold;
        }

        .momo-btn {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #12151c;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(9, 10, 15, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .modal-content {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            padding: 35px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal-content h3 {
            color: #fbbf24;
            margin-bottom: 12px;
            font-size: 1.4rem;
        }

        .modal-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .modal-input {
            width: 100%;
            padding: 14px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-bottom: 24px;
            outline: none;
            text-align: center;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-btn-confirm {
            flex: 1;
            background: var(--accent-success);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-btn-cancel {
            flex: 1;
            background: #374151;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .search-box {
            width: 100%;
            max-width: 1000px;
            padding: 14px 20px;
            margin-bottom: 25px;
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 1000px;
        }

        .lang-card {
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lang-card strong {
            color: var(--text-main);
        }

        @media(max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
            .premium-dashboard {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-logo">K</div>
            <h1>KuaduCode IDE</h1>
        </div>
        <div class="header-badge">
            <span>🇬🇭</span> MTN MoMo Ready
        </div>
    </header>

    <!-- Language Navigation Tabs -->
    <div class="lang-tabs" id="tab-container">
        <button class="tab-btn active" onclick="switchLanguage('web')">Web (HTML/CSS/JS)</button>
        <button class="tab-btn" onclick="switchLanguage('python')">Python</button>
        <button class="tab-btn" onclick="switchLanguage('java')">Java</button>
        <button class="tab-btn" onclick="switchLanguage('cpp')">C++</button>
        <button class="tab-btn" onclick="switchLanguage('csharp')">C#</button>
        <button class="tab-btn" onclick="switchLanguage('go')">Go</button>
        <button class="tab-btn" onclick="switchLanguage('typescript')">TypeScript</button>
        <button class="tab-btn" onclick="switchLanguage('swift')">Swift</button>
        <button class="tab-btn" onclick="switchLanguage('kotlin')">Kotlin</button>
        <button class="tab-btn" onclick="switchLanguage('sql')">SQL</button>
        <button class="tab-btn" onclick="switchLanguage('r')">R</button>
        <button class="tab-btn premium" onclick="switchLanguage('premium')">👑 KuaduCode Premium (200+ Langs)</button>
    </div>

    <!-- Workspace Container -->
    <div class="workspace" id="editor-workspace"></div>

    <!-- MTN MoMo Payment Modal -->
    <div class="modal-overlay" id="momo-modal">
        <div class="modal-content">
            <h3 id="modal-title">MTN Mobile Money Payment</h3>
            <p id="modal-desc">Enter your MTN number to approve payment.</p>
            <input type="tel" id="momo-phone" class="modal-input" placeholder="024 XXX XXXX" maxlength="10">
            <div class="modal-actions">
                <button class="modal-btn-confirm" onclick="confirmMoMoPayment()">Authorize</button>
                <button class="modal-btn-cancel" onclick="closeMoMoModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const templates = {
            web: {
                html: '<h1>Hello Web Developer!</h1>\n<p>Edit HTML, CSS, or JS to see live updates.</p>',
                css: 'body { font-family: sans-serif; text-align: center; margin-top: 40px; color: #333; }',
                js: 'console.log("KuaduCode Web console ready!");'
            },
            python: `print("Hello from KuaduCode Python!")\nx = 15\ny = 25\nprint(f"The sum of x + y is {x + y}")`,
            java: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello from KuaduCode Java!");\n    }\n}`,
            cpp: `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello from KuaduCode C++!" << endl;\n    return 0;\n}`,
            csharp: `using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello from KuaduCode C#!");\n    }\n}`,
            go: `package main\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Hello from KuaduCode Go!")\n}`,
            typescript: `const greeting: string = "Hello from KuaduCode TypeScript!";\nconsole.log(greeting);`,
            swift: `print("Hello from KuaduCode Swift!")`,
            kotlin: `fun main() {\n    println("Hello from KuaduCode Kotlin!")\n}`,
            sql: `CREATE TABLE learners (id INT, name TEXT);\nINSERT INTO learners VALUES (1, 'Kofi');\nSELECT * FROM learners;`,
            r: `cat("Hello from KuaduCode R!\\n")`
        };

        // Fixed and stabilized runtime configs for reliable execution
        const pistonRuntimes = {
            python: { language: 'python', version: '3.10.0' },
            java: { language: 'java', version: '15.0.2' },
            cpp: { language: 'cpp', version: '10.2.0' },
            csharp: { language: 'csharp', version: '6.12.0' },
            go: { language: 'go', version: '1.16.2' },
            typescript: { language: 'typescript', version: '4.5.2' },
            swift: { language: 'swift', version: '5.3.3' },
            kotlin: { language: 'kotlin', version: '1.4.30' },
            sql: { language: 'sqlite3', version: '3.36.0' },
            r: { language: 'r', version: '4.1.0' }
        };

        const premiumLanguages = [
            "Assembly (x86)", "Ada", "ActionScript", "Agda", "Alloy", "AmbientTalk", "Apex", "APL", "AppleScript", "Arc", "Arduino", "AspectJ", "Assembly (ARM)", "Asymptote", "ATS", "Augeas", "AutoIt", "AutoHotkey", "Awk", "Bash", "BASIC", "Batchfile", "BCPL", "Befunge", "Bison", "Bluespec", "Boo", "Boomerang", "Bosque", "Brainfuck", "Brightscript", "Bro", "C", "C--", "C#", "C++", "C/AL", "Caché ObjectScript", "Carbon", "Ceylon", "Chapel", "ChucK", "Cirru", "Clarion", "Clean", "Clojure", "CMake", "COBOL", "CoffeeScript", "ColdFusion", "Common Lisp", "Component Pascal", "Crystal", "Csound", "CUDA", "Cycript", "Cython", "D", "Dart", "DataWeave", "Dhall", "Dylan", "E", "Eagle", "Easybuild", "eC", "ECL", "ECLiPSe", "Edn", "Eiffel", "Elixir", "Elm", "Emacs Lisp", "Erlang", "Euphoria", "F#", "F*", "Factor", "Fancy", "Fantom", "Fennel", "Fish", "Forth", "Fortran", "FreeMarker", "Futhark", "G-Code", "GameMaker Language", "GAMS", "GAP", "GAS", "GDScript", "Genie", "Genshi", "GLSL", "Glyph", "Gnuplot", "Go", "Gosu", "Grace", "Gradle", "GraphQL", "Groovy", "Hack", "Haml", "Harbour", "Haskell", "Haxe", "HCL", "HLSL", "HTML", "HTTP", "Hy", "HyPhy", "IDL", "Idris", "IGOR Pro", "Inform", "Inno Setup", "Io", "Ioke", "Isabelle", "J", "Jade", "Jakt", "Janet", "Java", "JavaScript", "JFlex", "Jison", "Jolie", "JSON", "JSX", "Julia", "KCL", "KiCad", "Kotlin", "KRL", "LabVIEW", "Lasso", "Lean", "Less", "LilyPond", "Limbo", "Lisp", "LiveScript", "LLVM", "Logtalk", "LOLCODE", "LookML", "LoomScript", "LUA", "M", "M4", "Macaulay2", "Makefile", "Mako", "Markdown", "Mathematica", "MATLAB", "Max", "MAXScript", "Mercury", "Meson", "Metal", "Mirah", "Modelica", "Modula-2", "Modula-3", "Monkey", "Moocode", "MoonScript", "Mortran", "Mouse", "MSBuild", "Mupad", "MQL4", "MQL5", "NCL", "Nearley", "Nemerle", "NetLogo", "Nextflow", "Nginx", "Nim", "Nit", "Nix", "NSIS", "Nu", "NumPy", "Objective-C", "Objective-J", "OCaml", "Odin", "Omgrofl", "Opa", "Opal", "OpenEdge ABL", "OpenSCAD", "Org", "Ox", "Oxygene", "Oz", "P4", "Pan", "Papyrus", "Parrot", "Pascal", "PAWN", "PDDL", "PEG.js", "Perl", "PHP", "PicoLisp", "Pike", "PL/I", "PL/SQL", "PogoScript", "Pony", "PostScript", "PowerShell", "Prisma", "Processing", "Prolog", "Propeller Spin", "Pug", "Puppet", "PureBasic", "PureScript", "Python", "Q", "QML", "QBasic", "R", "Racket", "Raku", "RAML", "Reason", "Rebol", "Red", "Redcode", "Ren'Py", "REXX", "Ring", "Riot", "RobotFramework", "Roff", "Rouge", "RPC", "RPM Spec", "Ruby", "Rust", "SAS", "Sass", "Scala", "Scheme", "Scilab", "Self", "ShaderLab", "Shell", "Shen", "Sieve", "Silver", "Simula", "SKILL", "Smalltalk", "Smarty", "Smali", "Snort", "Solidity", "SourcePawn", "SPARQL", "SQF", "SQL", "Stan", "Stata", "Starlark", "Svelte", "SVG", "Swift", "SystemVerilog", "Tcl", "TeX", "Thrift", "T-SQL", "TypeScript", "Typst", "UnrealScript", "Vala", "VBScript", "Verilog", "VHDL", "Vim script", "Visual Basic", "Volt", "Vue", "WebAssembly", "Wollok", "XML", "XQuery", "YAML", "Yacc", "Zig"
        ];

        let currentLang = 'web';
        let selectedPlan = { amount: 0, name: '' };

        function switchLanguage(lang) {
            currentLang = lang;
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const workspace = document.getElementById('editor-workspace');

            if (lang === 'web') {
                workspace.innerHTML = `
                    <div class="pane">
                        <div class="pane-header">&lt;/&gt; HTML / CSS / JS Editor</div>
                        <textarea id="web-code" placeholder="Write code...">${templates.web.html}\n\n<style>${templates.web.css}</style>\n\n<script>${templates.web.js}<\/script></textarea>
                    </div>
                    <div class="pane">
                        <div class="pane-header">👁 Live Preview</div>
                        <iframe id="output-frame"></iframe>
                    </div>
                `;
                document.getElementById('web-code').addEventListener('input', updateWebPreview);
                updateWebPreview();
            } else if (lang === 'premium') {
                workspace.innerHTML = `
                    <div class="premium-dashboard">
                        <div class="premium-hero">
                            <h2>👑 KuaduCode Premium Membership</h2>
                            <p>Unlock all 200+ language project briefs and advanced challenge paths instantly via MTN Mobile Money.</p>
                        </div>

                        <div class="pricing-cards">
                            <div class="price-card">
                                <div>
                                    <h3>Starter Package</h3>
                                    <div class="price-amount">10 GHS</div>
                                    <ul class="price-features">
                                        <li>Basic starter guides</li>
                                        <li>Introductory challenges</li>
                                        <li>MTN MoMo instant prompt</li>
                                    </ul>
                                </div>
                                <button class="momo-btn" onclick="openMoMoModal(10, 'Starter Package')">Pay 10 GHS via MoMo</button>
                            </div>

                            <div class="price-card" style="border-color: #ec4899;">
                                <div>
                                    <h3>Practice Plus</h3>
                                    <div class="price-amount">20 GHS</div>
                                    <ul class="price-features">
                                        <li>Full 200+ language directory</li>
                                        <li>Intermediate track briefs</li>
                                        <li>Project checklists</li>
                                    </ul>
                                </div>
                                <button class="momo-btn" onclick="openMoMoModal(20, 'Practice Plus')">Pay 20 GHS via MoMo</button>
                            </div>

                            <div class="price-card">
                                <div>
                                    <h3>Pro Learning Pack</h3>
                                    <div class="price-amount">45 GHS</div>
                                    <ul class="price-features">
                                        <li>Lifetime all-access pass</li>
                                        <li>Advanced project briefs</li>
                                        <li>Guided study plans</li>
                                    </ul>
                                </div>
                                <button class="momo-btn" onclick="openMoMoModal(45, 'Pro Learning Pack')">Pay 45 GHS via MoMo</button>
                            </div>
                        </div>

                        <input type="text" class="search-box" id="lang-search" placeholder="Search from 200+ programming languages..." onkeyup="filterLanguages()">
                        <div class="lang-grid" id="lang-grid-container">
                            ${premiumLanguages.map((l, index) => `<div class="lang-card"><strong>${l}</strong> <span>#${index+1}</span></div>`).join('')}
                        </div>
                    </div>
                `;
            } else {
                workspace.innerHTML = `
                    <div class="pane">
                        <div class="pane-header">
                            <span>💻 ${lang.toUpperCase()} Editor</span>
                            <button class="run-btn" onclick="runLiveCode()">▶ Run Code</button>
                        </div>
                        <textarea id="code-input">${templates[lang]}</textarea>
                    </div>
                    <div class="pane">
                        <div class="pane-header">📤 Execution Output</div>
                        <div class="output-container" id="output-console">Click 'Run Code' to execute your program...</div>
                    </div>
                `;
            }
        }

        async function runLiveCode() {
            const codeInput = document.getElementById('code-input').value;
            const consoleBox = document.getElementById('output-console');
            consoleBox.innerHTML = `Executing ${currentLang.toUpperCase()} code... Please wait...`;

            const runtime = pistonRuntimes[currentLang];
            if (!runtime) {
                consoleBox.innerHTML = "Error: Execution runtime is not configured for this language.";
                return;
            }

            try {
                const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        language: runtime.language,
                        version: runtime.version,
                        files: [{ content: codeInput }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                const data = await response.json();
                
                if (data.run) {
                    const stdout = data.run.output || "";
                    const stderr = data.run.stderr || "";
                    const compileError = data.compile ? (data.compile.stderr || data.compile.output || "") : "";

                    let finalOutput = "";
                    if (compileError) finalOutput += `[Compilation Error]\n${compileError}\n\n`;
                    if (stderr) finalOutput += `[Runtime Error]\n${stderr}\n\n`;
                    if (stdout) finalOutput += stdout;

                    consoleBox.innerHTML = finalOutput.trim() || "Program executed successfully with no output.";
                } else {
                    consoleBox.innerHTML = "Error: Unexpected response structure from execution server.";
                }
            } catch (err) {
                consoleBox.innerHTML = `Execution Error: Unable to reach code runner API.\nDetails: ${err.message}\n\nPlease check your internet connection or try again.`;
            }
        }

        function openMoMoModal(amount, planName) {
            selectedPlan = { amount, name: planName };
            document.getElementById('modal-title').innerText = `MTN MoMo: ${planName}`;
            document.getElementById('modal-desc').innerText = `You are about to pay ${amount} GHS. Enter your MTN number below:`;
            document.getElementById('momo-phone').value = '';
            document.getElementById('momo-modal').style.display = 'flex';
        }

        function closeMoMoModal() {
            document.getElementById('momo-modal').style.display = 'none';
        }

        function confirmMoMoPayment() {
            const phone = document.getElementById('momo-phone').value.trim();
            if (!phone || phone.length < 10) {
                alert('Please enter a valid 10-digit MTN Mobile Money phone number.');
                return;
            }
            closeMoMoModal();
            alert(`✅ Payment request sent successfully to ${phone} for ${selectedPlan.amount} GHS (${selectedPlan.name}). Please check your phone and approve the prompt.`);
        }

        function filterLanguages() {
            const query = document.getElementById('lang-search').value.toLowerCase();
            const container = document.getElementById('lang-grid-container');
            const filtered = premiumLanguages.filter(l => l.toLowerCase().includes(query));
            container.innerHTML = filtered.map((l) => `<div class="lang-card"><strong>${l}</strong></div>`).join('');
        }

        function updateWebPreview() {
            const code = document.getElementById('web-code').value;
            const frame = document.getElementById('output-frame');
            const doc = frame.contentDocument || frame.contentWindow.document;
            doc.open();
            doc.write(code);
            doc.close();
        }

        // Initialize with Web view on load
        switchLanguage('web');
    </script>
</body>
</html>
