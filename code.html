<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaduCode — Anime Edition IDE & Code Runner</title>
    <style>
        :root {
            --bg-base: #080711;
            --bg-surface: #100f1d;
            --bg-elevated: #1a1831;
            --border-color: #2e2858;
            --text-main: #f3f0ff;
            --text-muted: #9b93c9;
            --anime-cyan: #00f0ff;
            --anime-pink: #ff007f;
            --anime-purple: #9d00ff;
            --anime-green: #39ff14;
            --anime-yellow: #ffee00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Floating Anime Cyber Particles background effect */
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: var(--anime-cyan);
            border-radius: 50%;
            animation: floatUp 8s infinite linear;
            opacity: 0.2;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        header, .lang-tabs, .workspace {
            z-index: 1;
        }

        header {
            background-color: var(--bg-surface);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(157, 0, 255, 0.15);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            background: linear-gradient(135deg, var(--anime-cyan), var(--anime-pink));
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: white;
            font-size: 1.3rem;
            box-shadow: 0 0 15px var(--anime-pink);
            animation: neonPulse 2s infinite alternate;
        }

        @keyframes neonPulse {
            0% { box-shadow: 0 0 10px var(--anime-pink), inset 0 0 5px var(--anime-cyan); }
            100% { box-shadow: 0 0 25px var(--anime-cyan), inset 0 0 10px var(--anime-pink); }
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--anime-cyan), var(--anime-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .status-badge {
            font-size: 0.8rem;
            color: var(--anime-green);
            background: var(--bg-elevated);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--anime-green);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--anime-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--anime-green);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .lang-tabs {
            display: flex;
            background-color: var(--bg-surface);
            padding: 12px 20px;
            gap: 10px;
            overflow-x: auto;
            border-bottom: 2px solid var(--border-color);
            scrollbar-width: thin;
        }

        .tab-btn {
            background-color: var(--bg-elevated);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--anime-cyan);
            border-color: var(--anime-cyan);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--anime-purple), var(--anime-pink));
            color: #ffffff;
            border-color: var(--anime-pink);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
        }

        .tab-btn.premium {
            background: linear-gradient(135deg, var(--anime-yellow), #ff5500);
            color: #0b0711;
            border: none;
            font-weight: 800;
            box-shadow: 0 0 15px rgba(255, 238, 0, 0.4);
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            background-color: var(--bg-base);
            gap: 14px;
            padding: 14px;
            overflow: hidden;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pane {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .pane:hover {
            border-color: var(--anime-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .pane-header {
            background-color: var(--bg-elevated);
            padding: 12px 18px;
            font-size: 0.9rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
        }

        .pane-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-btn {
            background: var(--bg-surface);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            color: var(--anime-cyan);
            border-color: var(--anime-cyan);
            background: var(--bg-elevated);
            transform: translateY(-1px);
        }

        .run-btn {
            background: linear-gradient(135deg, var(--anime-green), #00aa44);
            color: #080711;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 800;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
        }

        .run-btn:hover {
            transform: scale(1.08) rotate(-1deg);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.7);
        }

        textarea {
            flex: 1;
            background-color: var(--bg-surface);
            color: var(--text-main);
            border: none;
            padding: 20px;
            resize: none;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            outline: none;
            line-height: 1.6;
            tab-size: 4;
        }

        .output-container {
            flex: 1;
            background-color: #040308;
            color: var(--anime-cyan);
            padding: 20px;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.05);
        }

        iframe {
            flex: 1;
            border: none;
            background-color: #ffffff;
        }

        /* Premium Dashboard */
        .premium-dashboard {
            grid-column: span 2;
            padding: 40px;
            overflow-y: auto;
            background-color: var(--bg-surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: slideUp 0.4s ease-out;
        }

        .premium-hero {
            text-align: center;
            max-width: 700px;
            margin-bottom: 40px;
        }

        .premium-hero h2 {
            font-size: 2.5rem;
            margin-bottom: 12px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--anime-yellow), var(--anime-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
        }

        .pricing-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 40px;
        }

        .price-card {
            background-color: var(--bg-elevated);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .price-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--anime-pink);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.3);
        }

        .price-card h3 {
            font-size: 1.35rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .price-amount {
            font-size: 2.3rem;
            font-weight: 900;
            color: var(--anime-green);
            margin-bottom: 18px;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }

        .price-features {
            list-style: none;
            margin-bottom: 28px;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .price-features li::before {
            content: "⚡ ";
            color: var(--anime-yellow);
        }

        .momo-btn {
            background: linear-gradient(135deg, var(--anime-yellow), #ff7700);
            color: #080711;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 238, 0, 0.3);
        }

        .momo-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 238, 0, 0.6);
            filter: brightness(1.1);
        }

        /* Modal Animation */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 3, 8, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-elevated);
            border: 2px solid var(--anime-cyan);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
            transform: scale(0.8) rotate(-3deg);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) rotate(0deg);
        }

        .modal-content h3 {
            color: var(--anime-yellow);
            margin-bottom: 12px;
            font-size: 1.5rem;
        }

        .modal-content p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .modal-input {
            width: 100%;
            padding: 14px;
            background: var(--bg-surface);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 1.1rem;
            margin-bottom: 24px;
            outline: none;
            text-align: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .modal-input:focus {
            border-color: var(--anime-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-btn-confirm {
            flex: 1;
            background: var(--anime-green);
            color: #080711;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.4);
        }

        .modal-btn-confirm:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.7);
        }

        .modal-btn-cancel {
            flex: 1;
            background: #2e2858;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-btn-cancel:hover {
            background: #40367a;
        }

        .search-box {
            width: 100%;
            max-width: 1000px;
            padding: 16px 24px;
            margin-bottom: 25px;
            background-color: var(--bg-elevated);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box:focus {
            border-color: var(--anime-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .lang-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
            width: 100%;
            max-width: 1000px;
        }

        .lang-card {
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .lang-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--anime-cyan);
            color: var(--text-main);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .lang-card strong {
            color: var(--anime-cyan);
        }

        @media(max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
            .premium-dashboard {
                grid-column: span 1;
            }
        }
    </style>
</head>

    <header>

    <script>
        // Generate ambient floating particles for anime cyber effect
        const particleContainer = document.getElementById('particles-container');
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = `${Math.random() * 100}%`;
            p.style.width = `${Math.random() * 4 + 2}px`;
            p.style.height = p.style.width;
            p.style.animationDuration = `${Math.random() * 6 + 4}s`;
            p.style.animationDelay = `${Math.random() * 5}s`;
            particleContainer.appendChild(p);
        }

            go: `package main\nimport "fmt"\n\nfunc main() {\n    fmt.Println("⚡ Hello Go Matrix!")\n}`,
            typescript: `const coder: string = "TypeScript Ninja";\nconsole.log(\`⚡ Hello \${coder}!\`);`,
            swift: `print("⚡ Hello Swift Developer!")`,
            kotlin: `fun main() {\n    println("⚡ Hello Kotlin Hero!")\n}`,
            sql: `CREATE TABLE anime_heroes (id INT, name TEXT);\nINSERT INTO anime_heroes VALUES (1, 'Naruto');\nSELECT * FROM anime_heroes;`,
            r: `cat("⚡ Hello R Data Samurai!\\n")`
        };

        const pistonRuntimes = {
            python: { language: 'python', version: '3.10.0' },
            java: { language: 'java', version: '15.0.2' },
            cpp: { language: 'cpp', version: '10.2.0' },
            csharp: { language: 'csharp', version: '6.12.0' },
            go: { language: 'go', version: '1.16.2' },

            kotlin: { language: 'kotlin', version: '1.4.30' },
            sql: { language: 'sqlite3', version: '3.36.0' },
            r: { language: 'r', version: '4.1.0' }

        const premiumLanguages = [
            "Assembly (x86)", "Ada", "ActionScript", "Agda", "Alloy", "AmbientTalk", "Apex", "APL", "AppleScript", "Arc", "Arduino", "AspectJ", "Assembly (ARM)", "Asymptote", "ATS", "Augeas", "AutoIt", "AutoHotkey", "Awk", "Bash", "BASIC", "Batchfile", "BCPL", "Befunge", "Bison", "Bluespec", "Boo", "Boomerang", "Bosque", "Brainfuck", "Brightscript", "Bro", "C", "C--", "C#", "C++", "C/AL", "Caché ObjectScript", "Carbon", "Ceylon", "Chapel", "ChucK", "Cirru", "Clarion", "Clean", "Clojure", "CMake", "COBOL", "CoffeeScript", "ColdFusion", "Common Lisp", "Component Pascal", "Crystal", "Csound", "CUDA", "Cycript", "Cython", "D", "Dart", "DataWeave", "Dhall", "Dylan", "E", "Eagle", "Easybuild", "eC", "ECL", "ECLiPSe", "Edn", "Eiffel", "Elixir", "Elm", "Emacs Lisp", "Erlang", "Euphoria", "F#", "F*", "Factor", "Fancy", "Fantom", "Fennel", "Fish", "Forth", "Fortran", "FreeMarker", "Futhark", "G-Code", "GameMaker Language", "GAMS", "GAP", "GAS", "GDScript", "Genie", "Genshi", "GLSL", "Glyph", "Gnuplot", "Go", "Gosu", "Grace", "Gradle", "GraphQL", "Groovy", "Hack", "Haml", "Harbour", "Haskell", "Haxe", "HCL", "HLSL", "HTML", "HTTP", "Hy", "HyPhy", "IDL", "Idris", "IGOR Pro", "Inform", "Inno Setup", "Io", "Ioke", "Isabelle", "J", "Jade", "Jakt", "Janet", "Java", "JavaScript", "JFlex", "Jison", "Jolie", "JSON", "JSX", "Julia", "KCL", "KiCad", "Kotlin", "KRL", "LabVIEW", "Lasso", "Lean", "Less", "LilyPond", "Limbo", "Lisp", "LiveScript", "LLVM", "Logtalk", "LOLCODE", "LookML", "LoomScript", "LUA", "M", "M4", "Macaulay2", "Makefile", "Mako", "Markdown", "Mathematica", "MATLAB", "Max", "MAXScript", "Mercury", "Meson", "Metal", "Mirah", "Modelica", "Modula-2", "Modula-3", "Monkey", "Moocode", "MoonScript", "Mortran", "Mouse", "MSBuild", "Mupad", "MQL4", "MQL5", "NCL", "Nearley", "Nemerle", "NetLogo", "Nextflow", "Nginx", "Nim", "Nit", "Nix", "NSIS", "Nu", "NumPy", "Objective-C", "Objective-J", "OCaml", "Odin", "Omgrofl", "Opa", "Opal", "OpenEdge ABL", "OpenSCAD", "Org", "Ox", "Oxygene", "Oz", "P4", "Pan", "Papyrus", "Parrot", "Pascal", "PAWN", "PDDL", "PEG.js", "Perl", "PHP", "PicoLisp", "Pike", "PL/I", "PL/SQL", "PogoScript", "Pony", "PostScript", "PowerShell", "Prisma", "Processing", "Prolog", "Propeller Spin", "Pug", "Puppet", "PureBasic", "PureScript", "Python", "Q", "QML", "QBasic", "R", "Racket", "Raku", "RAML", "Reason", "Rebol", "Red", "Redcode", "Ren'Py", "REXX", "Ring", "Riot", "RobotFramework", "Roff", "Rouge", "RPC", "RPM Spec", "Ruby", "Rust", "SAS", "Sass", "Scala", "Scheme", "Scilab", "Self", "ShaderLab", "Shell", "Shen", "Sieve", "Silver", "Simula", "SKILL", "Smalltalk", "Smarty", "Smali", "Snort", "Solidity", "SourcePawn", "SPARQL", "SQF", "SQL", "Stan", "Stata", "Starlark", "Svelte", "SVG", "Swift", "SystemVerilog", "Tcl", "TeX", "Thrift", "T-SQL", "TypeScript", "Typst", "UnrealScript", "Vala", "VBScript", "Verilog", "VHDL", "Vim script", "Visual Basic", "Volt", "Vue", "WebAssembly", "Wollok", "XML", "XQuery", "YAML", "Yacc", "Zig"
        ];

        let currentLang = 'web';
        let selectedPlan = { amount: 0, name: '' };

        // Keyboard Shortcut: Ctrl+Enter / Cmd+Enter to Run
        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                if (currentLang !== 'web' && currentLang !== 'premium') {
                    runLiveCode();
                }
            }
        });

        function switchLanguage(lang) {
            currentLang = lang;
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const workspace = document.getElementById('editor-workspace');

            if (lang === 'web') {
                workspace.innerHTML = `
                    <div class="pane">
                        <div class="pane-header">
                            <span>&lt;/&gt; HTML / CSS / JS Editor</span>
                            <div class="pane-actions">
                                <button class="action-btn" onclick="resetTemplate()">Reset</button>
                                <button class="action-btn" onclick="copyCode('web-code')">Copy</button>
                            </div>
                        </div>
                        <textarea id="web-code" placeholder="Write code...">${templates.web.html}\n\n<style>${templates.web.css}</style>\n\n<script>${templates.web.js}<\/script></textarea>
                    </div>
                    <div class="pane">
                        <div class="pane-header">👁 Live Preview</div>
                        <iframe id="output-frame"></iframe>
                    </div>
                `;
                document.getElementById('web-code').addEventListener('input', updateWebPreview);
                updateWebPreview();
            } else if (lang === 'premium') {
                workspace.innerHTML = `
                    <div class="premium-dashboard">
                        <div class="premium-hero">
                            <h2>👑 KuaduCode Anime Elite Membership</h2>
                            <p>Unlock all 200+ language cyber directories and legendary challenge paths instantly via MTN Mobile Money.</p>
                        </div>

                        <div class="pricing-cards">
                            <div class="price-card">
                                <div>
                                    <h3>Genin Package</h3>
                                    <div class="price-amount">10 GHS</div>
                                    <ul class="price-features">
                                        <li>Starter cyber guides</li>
                                        <li>Basic anime challenges</li>
                                        <li>MTN MoMo instant prompt</li>
                                    </ul>
                                </div>
                                <button class="momo-btn" onclick="openMoMoModal(10, 'Genin Package')">Pay 10 GHS via MoMo ⚡</button>
                            </div>

                            <div class="price-card" style="border-color: var(--anime-pink);">
                                <div>
                                    <h3>Jonin Master</h3>
                                    <div class="price-amount">20 GHS</div>
                                    <ul class="price-features">
                                        <li>Full 200+ language directory</li>
                                        <li>Intermediate track briefs</li>
                                        <li>Cyber project checklists</li>
                                    </ul>
                                </div>
                                <button class="momo-btn" onclick="openMoMoModal(20, 'Jonin Master')">Pay 20 GHS via MoMo ⚡</button>
                            </div>

                            <div class="price-card">
                                <div>
                                    <h3>Hokage Legend</h3>
                                    <div class="price-amount">45 GHS</div>
                                    <ul class="price-features">
                                        <li>Lifetime VIP all-access</li>
                                        <li>Advanced samurai briefs</li>
                                        <li>Master study blueprints</li>
                                    </ul>
                                </div>
                                <button class="momo-btn" onclick="openMoMoModal(45, 'Hokage Legend')">Pay 45 GHS via MoMo ⚡</button>
                            </div>
                        </div>

                        <input type="text" class="search-box" id="lang-search" placeholder="Search from 200+ programming languages..." onkeyup="filterLanguages()">
                        <div class="lang-grid" id="lang-grid-container">
                            ${premiumLanguages.map((l, index) => `<div class="lang-card"><strong>${l}</strong> <span>#${index+1}</span></div>`).join('')}
                        </div>
                    </div>
                `;
            } else {
                workspace.innerHTML = `
                    <div class="pane">
                        <div class="pane-header">
                            <span>💻 ${lang.toUpperCase()} Cyber Editor</span>
                            <div class="pane-actions">
                                <button class="action-btn" onclick="resetTemplate()">Reset</button>
                                <button class="action-btn" onclick="copyCode('code-input')">Copy</button>
                                <button class="run-btn" onclick="runLiveCode()">⚡ Run (Ctrl+↵)</button>
                            </div>
                        </div>
                        <textarea id="code-input">${templates[lang]}</textarea>
                    </div>
                    <div class="pane">
                        <div class="pane-header">
                            <span>📤 Cyber Console Output</span>
                            <div class="pane-actions">
                                <button class="action-btn" onclick="clearOutput()">Clear</button>
                                <button class="action-btn" onclick="copyCode('output-console')">Copy Log</button>
                            </div>
                        </div>
                        <div class="output-container" id="output-console">Click 'Run' to unleash your program...</div>
                    </div>
                `;
            }
        }

        async function runLiveCode() {
            const codeInput = document.getElementById('code-input').value;
            const consoleBox = document.getElementById('output-console');
            consoleBox.innerHTML = `⚡ Executing ${currentLang.toUpperCase()} code in the Matrix... Please wait...`;

            const runtime = pistonRuntimes[currentLang];
            if (!runtime) {
                consoleBox.innerHTML = "Error: Execution runtime not configured for this language.";
                return;
            }

            try {
                const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        language: runtime.language,
                        version: runtime.version,
                        files: [{ content: codeInput }]
                    })
                });

                if (!response.ok) throw new Error(`Server status ${response.status}`);

                const data = await response.json();
                
                if (data.run) {
                    const stdout = data.run.output || "";
                    const stderr = data.run.stderr || "";
                    const compileError = data.compile ? (data.compile.stderr || data.compile.output || "") : "";

                    let finalOutput = "";
                    if (compileError) finalOutput += `[Compilation Error]\n${compileError}\n\n`;
                    if (stderr) finalOutput += `[Runtime Error]\n${stderr}\n\n`;
                    if (stdout) finalOutput += stdout;

                    consoleBox.innerHTML = finalOutput.trim() || "Program executed successfully with zero errors!";
                } else {
                    consoleBox.innerHTML = "Error: Unexpected server payload structure.";
                }
            } catch (err) {
                consoleBox.innerHTML = `Execution Error: Unable to reach runner server.\nDetails: ${err.message}`;
            }
        }

        function resetTemplate() {
            if (currentLang === 'web') return;
            document.getElementById('code-input').value = templates[currentLang];
        }

        function clearOutput() {
            document.getElementById('output-console').innerHTML = "Console cleared.";
        }

        function copyCode(targetId) {
            let text = "";
            const el = document.getElementById(targetId);
            if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') {
                text = el.value;
            } else {
                text = el.innerText;
            }
            navigator.clipboard.writeText(text).then(() => {
                alert('⚡ Copied to clipboard successfully!');
            });
        }

        function openMoMoModal(amount, planName) {
            selectedPlan = { amount, name: planName };
            document.getElementById('modal-title').innerText = `MTN MoMo: ${planName}`;
            document.getElementById('modal-desc').innerText = `You are about to unlock ${planName} for ${amount} GHS. Enter your MTN number below:`;
            document.getElementById('momo-phone').value = '';
            document.getElementById('momo-modal').classList.add('active');
        }

        function closeMoMoModal() {
            document.getElementById('momo-modal').classList.remove('active');
        }

        function confirmMoMoPayment() {
            const phone = document.getElementById('momo-phone').value.trim();
            if (!phone || phone.length < 10) {
                alert('Please enter a valid 10-digit MTN Mobile Money phone number.');
                return;
            }
            closeMoMoModal();
            alert(`⚡ Payment request sent successfully to ${phone} for ${selectedPlan.amount} GHS (${selectedPlan.name}). Check your phone to approve!`);
        }

        function filterLanguages() {
            const query = document.getElementById('lang-search').value.toLowerCase();
            const container = document.getElementById('lang-grid-container');
            const filtered = premiumLanguages.filter(l => l.toLowerCase().includes(query));
            container.innerHTML = filtered.map((l) => `<div class="lang-card"><strong>${l}</strong></div>`).join('');
        }

        function updateWebPreview() {
            const code = document.getElementById('web-code').value;
            const frame = document.getElementById('output-frame');
            const doc = frame.contentDocument || frame.contentWindow.document;
            doc.open();
            doc.write(code);
            doc.close();
        }

        // Initialize with Web view on load
        switchLanguage('web');
    </script>
</body>
</html>
