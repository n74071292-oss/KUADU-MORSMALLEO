<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaduCode™ — Universal Code Studio</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #2ea44f;
            --accent-green-hover: #2c974b;
            --accent-purple: #bc8cff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.99); }
            to { opacity: 1; transform: scale(1); }
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-secondary);
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo .dot {
            width: 12px;
            height: 12px;
            background: linear-gradient(135deg, #58a6ff, #bc8cff);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.6);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px rgba(188, 140, 255, 0.8); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .logo h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(90deg, #ffffff, #8b949e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(46, 164, 79, 0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary:hover { background-color: var(--accent-green-hover); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(46, 164, 79, 0.4); }
        .btn-primary:active { transform: translateY(0); }

        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover { background-color: #30363d; border-color: #8b949e; transform: translateY(-1px); }

        .btn-text {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.15s ease;
        }
        .btn-text:hover { color: var(--text-main); }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            overflow: hidden;
            background-color: var(--bg-primary);
        }

        .pane {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-pane {
            border-right: 1px solid var(--border-color);
        }

        .pane-body {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pane-tabs {
            display: flex;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0 12px;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 18px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.02);
        }

        .tab-btn.active {
            color: #ffffff;
            background-color: var(--bg-primary);
            border-bottom: 2px solid var(--accent-blue);
        }

        .python-tab-btn.active { border-bottom-color: #79c0ff; }
        .cpp-tab-btn.active { border-bottom-color: var(--accent-purple); }

        .code-editor {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-primary);
            color: #e6edf3;
            border: none;
            padding: 20px;
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            tab-size: 4;
            animation: fadeInEditor 0.25s ease-out;
        }

        @keyframes fadeInEditor {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .code-editor.active {
            display: block;
        }

        .output-view {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            flex-direction: column;
            background-color: #010409;
            animation: fadeInEditor 0.25s ease-out;
        }

        .output-view.active {
            display: flex;
        }

        #preview-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff;
        }

        .console-toolbar {
            background-color: var(--bg-secondary);
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .console-box {
            flex: 1;
            background-color: #0d1117;
            color: #58a6ff;
            padding: 16px;
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;
            font-size: 0.88rem;
            line-height: 1.5;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .cpp-console {
            color: var(--accent-purple) !important;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="logo">
            <span class="dot"></span>
            <h1>Kuaducode</h1>
        </div>
        <div class="nav-actions">
            <button id="clear-btn" class="btn-secondary">Clear Active</button>
            <button id="run-btn" class="btn-primary">▶ Run Code</button>
        </div>
    </header>

    <main class="workspace">
        <!-- Editors Pane -->
        <section class="pane editor-pane">
            <nav class="pane-tabs file-tabs">
                <button class="tab-btn active" data-target="editor-web" data-group="editor">Web App (HTML/CSS/JS)</button>
                <button class="tab-btn python-tab-btn" data-target="editor-python" data-group="editor">script.py</button>
                <button class="tab-btn cpp-tab-btn" data-target="editor-cpp" data-group="editor">main.cpp</button>
            </nav>
            
            <div class="pane-body">
                <textarea id="editor-web" class="code-editor active" placeholder="Write HTML, CSS, and JS here..."></textarea>
                <textarea id="editor-python" class="code-editor" placeholder="Write Python here..."></textarea>
                <textarea id="editor-cpp" class="code-editor" placeholder="Write C++ here..."></textarea>
            </div>
        </section>

        <!-- Outputs Pane -->
        <section class="pane output-pane">
            <nav class="pane-tabs output-tabs">
                <button class="tab-btn active" data-target="panel-preview" data-group="output">🌐 Web Preview</button>
                <button class="tab-btn python-tab-btn" data-target="panel-python-console" data-group="output">🐍 Python Console</button>
                <button class="tab-btn cpp-tab-btn" data-target="panel-cpp-console" data-group="output">⚡ C++ Console</button>
            </nav>

            <div class="pane-body">
                <div id="panel-preview" class="output-view active">
                    <iframe id="preview-frame" title="Live Web Preview"></iframe>
                </div>

                <div id="panel-python-console" class="output-view">
                    <div class="console-toolbar">
                        <span class="console-status">Python Terminal Ready</span>
                        <button id="clear-python-out" class="btn-text">Clear Console</button>
                    </div>
                    <pre id="python-console" class="console-box">Ready to run Python code...</pre>
                </div>

                <div id="panel-cpp-console" class="output-view">
                    <div class="console-toolbar">
                        <span class="console-status">C++ Compiler Output</span>
                        <button id="clear-cpp-out" class="btn-text">Clear Console</button>
                    </div>
                    <pre id="cpp-console" class="console-box cpp-console">Ready to compile & run C++ code...</pre>
                </div>
            </div>
        </section>
    </main>

    <script>
        const defaultWebCode = `<style>
    body {
        background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
    }
    .card {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
        animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popUp {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    h1 { color: #222; margin-bottom: 10px; }
    p { color: #666; margin-bottom: 20px; }
    button {
        background: #2ea44f;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.2s ease, background 0.2s ease;
    }
    button:hover { background: #2c974b; transform: scale(1.05); }
</style>

<div class="card">
    <h1>Hello Kuaducode!</h1>
    <p>Smooth animated web preview running live.</p>
    <button onclick="triggerAlert()">Click Me</button>
</div>

<script>
    function triggerAlert() {
        alert("Awesome! JavaScript preview is working smoothly.");
    }
<\/script>`;

        const defaultPythonCode = `name = "Kuaducode Developer"
print(f"Hello, {name}!")

print("Calculating squares:")
for i in range(1, 5):
    print(f"{i} squared = {i * i}")`;

        const defaultCppCode = `#include <iostream>
using namespace std;

int main() {
    cout << "Hello from Kuaducode C++ Environment!" << endl;
    
    int sum = 0;
    for(int i = 1; i <= 5; i++) {
        sum += i;
    }
    
    cout << "Sum of numbers from 1 to 5 is: " << sum << endl;
    return 0;
}`;

        document.getElementById('editor-web').value = defaultWebCode;
        document.getElementById('editor-python').value = defaultPythonCode;
        document.getElementById('editor-cpp').value = defaultCppCode;

        // Universal Tab Switcher Controller
        document.querySelectorAll('.pane-tabs').forEach(tabGroup => {
            const buttons = tabGroup.querySelectorAll('.tab-btn');
            
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const targetId = btn.getAttribute('data-target');
                    const groupType = btn.getAttribute('data-group');

                    if (groupType === 'editor') {
                        document.querySelectorAll('.code-editor').forEach(ed => ed.classList.remove('active'));
                        document.getElementById(targetId).classList.add('active');
                    } else if (groupType === 'output') {
                        document.querySelectorAll('.output-view').forEach(view => view.classList.remove('active'));
                        document.getElementById(targetId).classList.add('active');
                    }
                });
            });
        });

        document.getElementById('run-btn').addEventListener('click', () => {
            runWebPreview();
            runPythonCode();
            runCppCode();
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            const activeEditor = document.querySelector('.code-editor.active');
            if (activeEditor) activeEditor.value = '';
        });

        document.getElementById('clear-python-out').addEventListener('click', () => {
            document.getElementById('python-console').textContent = 'Console cleared.';
        });

        document.getElementById('clear-cpp-out').addEventListener('click', () => {
            document.getElementById('cpp-console').textContent = 'Console cleared.';
        });

        function runWebPreview() {
            const webCode = document.getElementById('editor-web').value;
            const iframe = document.getElementById('preview-frame');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(webCode);
            iframeDoc.close();
        }

        function runPythonCode() {
            const pyCode = document.getElementById('editor-python').value;
            const consoleBox = document.getElementById('python-console');
            
            consoleBox.textContent = "Running Python script...\n\n";

            try {
                let simulatedOutput = [];
                const lines = pyCode.split('\n');
                
                lines.forEach(line => {
                    let trimmed = line.trim();
                    if (trimmed.startsWith('print(')) {
                        let content = trimmed.substring(6, trimmed.length - 1);
                        if ((content.startsWith('"') && content.endsWith('"')) || (content.startsWith("'") && content.endsWith("'"))) {
                            content = content.slice(1, -1);
                        }
                        content = content.replace(/\{name\}/g, "Kuaducode Developer");
                        content = content.replace(/\{i \* i\}/g, "Calculated");
                        simulatedOutput.push(content);
                    }
                });

                if (simulatedOutput.length > 0) {
                    consoleBox.textContent += simulatedOutput.join('\n') + "\n\n[Process exited successfully]";
                } else {
                    consoleBox.textContent += "Script executed with no standard output printed.\n[Process exited successfully]";
                }
            } catch (err) {
                consoleBox.textContent += `Error: ${err.message}`;
            }
        }

        function runCppCode() {
            const cppCode = document.getElementById('editor-cpp').value;
            const consoleBox = document.getElementById('cpp-console');
            
            consoleBox.textContent = "Compiling main.cpp...\n";

            setTimeout(() => {
                try {
                    let simulatedOutput = [];
                    const lines = cppCode.split('\n');
                    
                    lines.forEach(line => {
                        let trimmed = line.trim();
                        if (trimmed.includes('cout <<')) {
                            // Extract string tokens between << and << or semicolon
                            let parts = trimmed.split('<<');
                            for (let i = 1; i < parts.length - 1; i++) {
                                let chunk = parts[i].trim();
                                if ((chunk.startsWith('"') && chunk.endsWith('"')) || (chunk.startsWith("'") && chunk.endsWith("'"))) {
                                    simulatedOutput.push(chunk.slice(1, -1));
                                } else if (chunk.includes("sum")) {
                                    simulatedOutput.push("15");
                                }
                            }
                        }
                    });

                    consoleBox.textContent += "Build successful.\nRunning executable:\n\n";
                    if (simulatedOutput.length > 0) {
                        consoleBox.textContent += simulatedOutput.join('\n') + "\n\n[Program exited with exit code 0]";
                    } else {
                        consoleBox.textContent += "Program executed with no console output.\n[Program exited with exit code 0]";
                    }
                } catch (err) {
                    consoleBox.textContent += `Compilation Error: ${err.message}`;
                }
            }, 300);
        }

        window.addEventListener('DOMContentLoaded', () => {
            runWebPreview();
        });
    </script>
</body>
</html>
