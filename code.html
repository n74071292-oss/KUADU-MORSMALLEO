<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaduCode™ — Code Lab & Studio</title>
    <style>
        :root {
            --bg-deep: #09080f;
            --bg-surface: #12101e;
            --bg-panel: #1a172c;
            --border-line: #2e2850;
            --text-main: #f4f2ff;
            --text-muted: #948fb8;
            --accent-primary: #7c3aed;
            --accent-glow: #06b6d4;
            --success-green: #10b981;
            --code-text: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Brand Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-line);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        .brand span {
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tm-badge {
            font-size: 0.65rem;
            background: var(--accent-primary);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            vertical-align: super;
            font-weight: 800;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border-line);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--accent-glow);
        }

        .btn-action {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-glow));
            color: white;
            border: none;
            font-weight: 600;
        }

        /* Workspace Grid */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Assistant Sidebar */
        aside {
            width: 380px;
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-line);
            display: flex;
            flex-direction: column;
        }

        .sidebar-title {
            padding: 14px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-bottom: 1px solid var(--border-line);
            color: var(--accent-glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-stream {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-bubble {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            line-height: 1.4;
            max-width: 90%;
            word-break: break-word;
        }

        .chat-bubble.assistant {
            background-color: var(--bg-panel);
            border-left: 3px solid var(--accent-primary);
            align-self: flex-start;
        }

        .chat-bubble.user {
            background-color: rgba(124, 58, 237, 0.2);
            border: 1px solid var(--border-line);
            align-self: flex-end;
        }

        .chat-bubble code {
            background: rgba(0,0,0,0.4);
            padding: 2px 5px;
            border-radius: 4px;
            color: var(--accent-glow);
            font-family: monospace;
        }

        .chat-input-zone {
            padding: 14px;
            border-top: 1px solid var(--border-line);
            background-color: var(--bg-deep);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .upload-box {
            border: 1px dashed var(--border-line);
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            background: var(--bg-surface);
        }

        .upload-box input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .input-row {
            display: flex;
            gap: 6px;
        }

        .chat-text-input {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border-line);
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
            font-size: 0.85rem;
        }

        .chat-text-input:focus {
            border-color: var(--accent-glow);
        }

        /* Main Editor Section */
        .editor-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-deep);
        }

        .tab-bar {
            display: flex;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-line);
            padding-left: 10px;
        }

        .file-tab {
            padding: 10px 18px;
            font-size: 0.82rem;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .file-tab.active {
            color: var(--accent-glow);
            border-bottom-color: var(--accent-glow);
            background-color: var(--bg-deep);
        }

        .code-area {
            flex: 1;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.92rem;
            color: var(--code-text);
            overflow: auto;
            white-space: pre-wrap;
            outline: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <span>KuaduCode</span><span class="tm-badge">TM</span> Code Lab
        </div>
        <div class="header-controls">
            <button class="btn" id="clear-btn">Clear Workspace</button>
            <button class="btn btn-action" id="run-code-btn">▶ Run Code</button>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        <!-- AI Assistant Sidebar -->
        <aside>
            <div class="sidebar-title">
                <span>KuaduCode™ Assistant</span>
                <span style="color: var(--success-green); font-size: 0.7rem;">● Ready</span>
            </div>
            <div class="chat-stream" id="chat-stream">
                <div class="chat-bubble assistant">
                    👋 Welcome to KuaduCode™ Lab! Type your coding questions, paste queries, or upload code files below for instant answers.
                </div>
            </div>
            <div class="chat-input-zone">
                <div class="upload-box" id="dropzone">
                    <input type="file" id="file-uploader">
                    📁 Drop or browse a file to load into workspace
                </div>
                <div class="input-row">
                    <input type="text" class="chat-text-input" id="user-query" placeholder="Ask a question (e.g. 'How do loops work?')">
                    <button class="btn btn-action" id="send-query-btn">Ask</button>
                </div>
            </div>
        </aside>

        <!-- Code Editor Area -->
        <main class="editor-main">
            <div class="tab-bar">
                <div class="file-tab active" data-file="index.html">index.html</div>
                <div class="file-tab" data-file="main.css">main.css</div>
                <div class="file-tab" data-file="app.js">app.js</div>
            </div>
            <div class="code-area" id="code-editor" contenteditable="true" spellcheck="false"></div>
        </main>
    </div>

    <!-- Script Engine -->
    <script>
        // Clean, empty workspace files (No templates)
        const workspaceFiles = {
            "index.html": "<!-- Write your HTML structure here -->\n",
            "main.css": "/* Write your styles here */\n",
            "app.js": "// Write your JavaScript logic here\n"
        };

        let activeFile = "index.html";
        const editor = document.getElementById("code-editor");
        editor.innerText = workspaceFiles[activeFile];

        // Tab Switching Handler
        document.querySelectorAll(".file-tab").forEach(tab => {
            tab.addEventListener("click", () => {
                workspaceFiles[activeFile] = editor.innerText;
                document.querySelectorAll(".file-tab").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                activeFile = tab.getAttribute("data-file");
                editor.innerText = workspaceFiles[activeFile];
            });
        });

        // Save on typing
        editor.addEventListener("input", () => {
            workspaceFiles[activeFile] = editor.innerText;
        });

        // File Upload Ingestion
        const fileUploader = document.getElementById("file-uploader");
        fileUploader.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const content = evt.target.result;
                workspaceFiles[file.name] = content;
                
                // Create tab if missing
                if (!document.querySelector(`.file-tab[data-file="${file.name}"]`)) { const newTab = document.createElement("div"); newTab.className = "file-tab active"; newTab.setAttribute("data-file", file.name); newTab.textContent = file.name; document.querySelectorAll(".file-tab").forEach(t => t.classList.remove("active")); document.querySelector(".tab-bar").appendChild(newTab); } activeFile = file.name; editor.innerText = content;  addChatBubble(`📁 Loaded <strong>${file.name}</strong> into your KuaduCode™ editor workspace.`, "assistant");
            };
            reader.readAsText(file);
        });

        // Chat & Question Assistant Engine
        const chatStream = document.getElementById("chat-stream");
        const queryInput = document.getElementById("user-query");
        const sendBtn = document.getElementById("send-query-btn");

        function addChatBubble(text, sender) {
            const bubble = document.createElement("div");
            bubble.className = `chat-bubble ${sender}`;
            bubble.innerHTML = text;
            chatStream.appendChild(bubble);
            chatStream.scrollTop = chatStream.scrollHeight;
        }

        function handleUserQuery() {
            const query = queryInput.value.trim();
            if (!query) return;

            addChatBubble(query, "user");
            queryInput.value = "";

            setTimeout(() => {
                let answer = `KuaduCode™ Assistant: I can help you write code for "<em>${query}</em>". Try adding your logic in the active <code>
