<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaduCode™ — Professional Web IDE & Advanced Developer Toolkit</title>
    <meta name="description" content="KuaduCode is a universal web code editor and IDE featuring live preview, Python environment, Kuadu AI, and fully functional professional Kali Linux and developer utilities.">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

    <style>
        :root {
            --primary-bg: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.96);
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent-green: #2ea44f;
            --accent-glow: rgba(46, 164, 79, 0.4);
            --accent-blue: #58a6ff;
            --accent-purple: #8957e5;
            --header-bg: #161b22;
            --tab-active: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            height: 60px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area h1 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .logo-area span {
            font-size: 0.75rem;
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent-blue);
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid rgba(88, 166, 255, 0.3);
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background-color: #21262d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #ffffff;
            border-color: rgba(27, 31, 35, 0.15);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn-primary:hover {
            background-color: #2c974b;
        }

        .btn-ai {
            background-color: rgba(137, 87, 229, 0.2);
            color: #d2a8ff;
            border-color: rgba(137, 87, 229, 0.4);
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            gap: 1px;
            background-color: var(--border-color);
            height: calc(100vh - 110px);
            overflow: hidden;
        }

        .pane {
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        .tab-bar {
            background-color: var(--header-bg);
            display: flex;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .tab {
            padding: 10px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #8b949e;
            background: transparent;
            border: none;
            border-right: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }

        .tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.02);
        }

        .tab.active {
            color: #ffffff;
            background-color: var(--tab-active);
            border-bottom: 2px solid var(--accent-blue);
        }

        .editor-container {
            position: relative;
            flex: 1;
            display: none;
            overflow: auto;
        }

        .editor-container.active {
            display: flex;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            color: var(--text-main);
            border: none;
            padding: 16px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .tools-panel {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
            overflow-y: auto;
            background: #0d1117;
        }

        .tool-section-card {
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tool-section-card h3 {
            font-size: 0.95rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-section-card p {
            font-size: 0.8rem;
            color: #8b949e;
        }

        .tool-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .tool-input, .tool-select {
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            flex: 1;
        }

        .tool-btn {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: #c9d1d9;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
        }

        .tool-btn:hover {
            background: #30363d;
            color: #fff;
        }

        .tool-output {
            font-family: monospace;
            font-size: 0.85rem;
            color: #7ee787;
            background: #040d21;
            padding: 10px;
            border-radius: 6px;
            word-break: break-all;
            white-space: pre-wrap;
            min-height: 38px;
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .terminal-box {
            background: #0b0f19;
            border: 1px solid #1f6feb;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #3fb950;
            height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }

        .output-pane-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #ffffff;
        }

        .output-header {
            background-color: var(--header-bg);
            padding: 10px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #8b949e;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        iframe {
            width: 100%;
            flex: 2;
            border: none;
            background-color: #ffffff;
        }

        .console-wrapper {
            flex: 1;
            background-color: #040d21;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .console-output {
            padding: 12px 16px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #7ee787;
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .console-input-row {
            display: flex;
            align-items: center;
            background: #0d1117;
            border-top: 1px solid var(--border-color);
            padding: 6px 12px;
        }

        .console-prompt-label {
            font-family: monospace;
            color: #58a6ff;
            font-weight: 600;
            font-size: 0.85rem;
            margin-right: 8px;
        }

        .console-input-field {
            flex: 1;
            background: transparent;
            border: none;
            color: #c9d1d9;
            font-family: monospace;
            font-size: 0.85rem;
            outline: none;
        }

        footer {
            height: 50px;
            background-color: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .ai-assistant-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #0d1117;
            padding: 16px;
            gap: 12px;
        }

        .ai-chat-history {
            flex: 1;
            background: #161b22;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .ai-msg {
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 88%;
            white-space: pre-wrap;
        }

        .ai-msg.assistant {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }

        .ai-msg.user {
            background: #1f6feb;
            color: #ffffff;
            align-self: flex-end;
        }

        .ai-input-box {
            display: flex;
            gap: 10px;
            background: #161b22;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            align-items: center;
        }

        .ai-input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .copy-chip {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: #c9d1d9;
            padding: 2px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .copy-chip:hover {
            background: #30363d;
            color: #fff;
        }
    </style>
</head>

        <div class="logo-area">
            <h1>KuaduCode™</h1>
            <span>Professional IDE & Upgraded Tools</span>

        <div class="toolbar">

            </div>

            <div id="html-container" class="editor-container active">
