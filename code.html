<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaduCode — code Editor</title>
    <meta name="description" content="KuaduCode is the ultimate universal web code editor and IDE featuring tabbed language switching, live preview, and instant multi-language execution.">
    <meta name="keywords" content="online IDE, code editor, Kuaducode, tabbed editor, live preview, html css js python studio">
    <meta name="author" content="Kuaducode Platform">
    
    <meta property="og:title" content="KuaduCode™ — Tabbed Code Studio">
    <meta property="og:description" content="Write, test, and run code instantly across HTML, CSS, JavaScript, and Python with Kuaducode's tabbed web studio.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://github.com/n74071292-oss/KUADU-MORSMALLEO">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary-bg: #0d1117;
            --panel-bg: rgba(22, 27, 34, 0.94);
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --accent-green: #2ea44f;
            --accent-glow: rgba(46, 164, 79, 0.4);
            --accent-blue: #58a6ff;
            --header-bg: #161b22;
            --tab-active: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            height: 60px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area h1 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .logo-area span {
            font-size: 0.75rem;
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent-blue);
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid rgba(88, 166, 255, 0.3);
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            background-color: #21262d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: #ffffff;
            border-color: rgba(27, 31, 35, 0.15);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .btn-primary:hover {
            background-color: #2c974b;
        }

        /* Workspace Grid Container */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            gap: 1px;
            background-color: var(--border-color);
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        .pane {
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        /* Tab Navigation Bar */
        .tab-bar {
            background-color: var(--header-bg);
            display: flex;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .tab-bar::-webkit-scrollbar {
            height: 4px;
        }

        .tab-bar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .tab {
            padding: 10px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #8b949e;
            background: transparent;
            border: none;
            border-right: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
        }

        .tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.02);
        }

        .tab.active {
            color: #ffffff;
            background-color: var(--tab-active);
            border-bottom: 2px solid var(--accent-blue);
        }

        /* Editor Containers with Scrollbars */
        .editor-container {
            position: relative;
            flex: 1;
            display: none;
            overflow: auto;
        }

        .editor-container.active {
            display: flex;
        }

        textarea {
            width: 100%;
            height: 100%;
            background: transparent;
            color: var(--text-main);
            border: none;
            padding: 16px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            white-space: pre;
            overflow: auto;
        }

        /* Output Pane Structure */
        .output-pane-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #ffffff;
        }

        .output-header {
            background-color: var(--header-bg);
            padding: 10px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #8b949e;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        iframe {
            width: 100%;
            flex: 2;
            border: none;
            background-color: #ffffff;
        }

        .console-output {
            padding: 12px 16px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #7ee787;
            background-color: #040d21;
            flex: 1;
            border-top: 1px solid var(--border-color);
            overflow-y: auto;
            white-space: pre-wrap;
            scrollbar-width: thin;
        }

        @media(max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>KuaduCode™</h1>
            <span>Tabbed Studio</span>
        </div>
        <div class="toolbar">
            <button class="btn" onclick="clearEditors()"><i class="fa-solid fa-trash"></i> Clear</button>
            <button class="btn btn-primary" onclick="runCode()"><i class="fa-solid fa-play"></i> Run Code</button>
        </div>
    </header>

    <div class="workspace">
        <!-- Editor Pane with Tab Navigation -->
        <div class="pane">
            <div class="tab-bar">
                <button class="tab active" onclick="switchTab(event, 'html-container')"><i class="fa-brands fa-html5" style="color: #e34f26;"></i> HTML</button>
                <button class="tab" onclick="switchTab(event, 'css-container')"><i class="fa-brands fa-css3-alt" style="color: #1572b6;"></i> CSS</button>
                <button class="tab" onclick="switchTab(event, 'js-container')"><i class="fa-brands fa-js" style="color: #f7df1e;"></i> JavaScript</button>
                <button class="tab" onclick="switchTab(event, 'python-container')"><i class="fa-brands fa-python" style="color: #3776ab;"></i> Python</button>
            </div>

            <!-- HTML Tab Container -->
            <div id="html-container" class="editor-container active">
                <textarea id="html-code"><!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #f0f2f5; font-family: sans-serif; text-align: center; padding-top: 40px; }
        h1 { color: #2ea44f; }
        p { color: #57606a; }
    </style>
</head>
<body>
    <h1>Welcome to KuaduCode Tabbed Studio!</h1>
    <p>Switch tabs to edit each language separately with full scrolling capability.</p>
</body>
</html></textarea>
            </div>

            <!-- CSS Tab Container -->
            <div id="css-container" class="editor-container">
                <textarea id="css-code">body {
    background: #0d1117 !important;
}
h1 {
    color: #58a6ff !important;
}
p {
    color: #c9d1d9 !important;
}</textarea>
            </div>

            <!-- JavaScript Tab Container -->
            <div id="js-container" class="editor-container">
                <textarea id="js-code">console.log("KuaduCode JavaScript engine running smoothly.");</textarea>
            </div>

            <!-- Python Tab Container -->
            <div id="python-container" class="editor-container">
                <textarea id="python-code">def display_welcome(name):
    print(f"Hello from Python, {name}!")

display_welcome("KuaduCode Developer")</textarea>
            </div>
        </div>

        <!-- Live Preview & Output Pane -->
        <div class="pane">
            <div class="output-pane-container">
                <div class="output-header">
                    <span><i class="fa-solid fa-desktop"></i> LIVE PREVIEW</span>
                    <span>Output & Console</span>
                </div>
                <iframe id="live-preview"></iframe>
                <div id="console-box" class="console-output">// Console and Runtime Output Ready</div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(evt, containerId) {
            const containers = document.querySelectorAll('.editor-container');
            containers.forEach(container => container.classList.remove('active'));

            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => tab.classList.remove('active'));

            document.getElementById(containerId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function runCode() {
            const html = document.getElementById('html-code').value;
            const css = document.getElementById('css-code').value;
            const js = document.getElementById('js-code').value;
            const python = document.getElementById('python-code').value;
            const consoleBox = document.getElementById('console-box');

            consoleBox.innerHTML = "";

            let finalHtml = html + `<style>${css}</style><script>
                const oldLog = console.log;
                console.log = function(...args) {
                    oldLog.apply(console, args);
                    window.parent.postMessage({ type: 'CONSOLE', message: args.join(' ') }, '*');
                };
                try {
                    ${js}
                } catch(err) {
                    console.error(err);
                }
            <\/script>`;

            const iframe = document.getElementById('live-preview');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(finalHtml);
            iframeDoc.close();

            consoleBox.innerHTML += `[Python Simulation Output]:\n${python}\n--------------------\n[Status]: Project executed successfully.\n`;
        }

        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'CONSOLE') {
                const consoleBox = document.getElementById('console-box');
                consoleBox.innerHTML += `> ${e.data.message}\n`;
                consoleBox.scrollTop = consoleBox.scrollHeight;
            }
        });

        function clearEditors() {
            document.getElementById('html-code').value = "";
            document.getElementById('css-code').value = "";
            document.getElementById('js-code').value = "";
            document.getElementById('python-code').value = "";
            document.getElementById('console-box').innerHTML = "// Cleared.";
        }

        window.onload = runCode;
    </script>
</body>
</html>
