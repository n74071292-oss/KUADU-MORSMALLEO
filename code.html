<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaduCode™ — Universal Code & AI Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="top-nav">
        <div class="logo">
            <span class="dot"></span>
            <h1>Kuaducode</h1>
        </div>
        <div class="nav-actions">
            <a href="#" class="btn-pro">⭐ Upgrade Pro (GHS 10 - 90)</a>
            <button id="clear-btn" class="btn-secondary">Clear</button>
            <button id="run-btn" class="btn-primary">▶ Run Code</button>
        </div>
    </header>

    <!-- File Tabs Bar -->
    <nav class="file-tabs">
        <button class="tab-btn active" data-file="html">index.html</button>
        <button class="tab-btn" data-file="css">style.css</button>
        <button class="tab-btn" data-file="js">script.js</button>
        <button class="tab-btn" data-file="php">index.php</button>
        <button class="tab-btn python-tab" data-file="python">script.py</button>
    </nav>

    <!-- Main Workspace -->
    <main class="workspace">
        <!-- Code Editors Container -->
        <div class="editor-container">
            <textarea id="editor-html" class="code-editor active" placeholder="Write HTML here..."></textarea>
            <textarea id="editor-css" class="code-editor" placeholder="Write CSS here..."></textarea>
            <textarea id="editor-js" class="code-editor" placeholder="Write JavaScript here..."></textarea>
            <textarea id="editor-php" class="code-editor" placeholder="Write PHP here..."></textarea>
            <textarea id="editor-python" class="code-editor" placeholder="Write Python here...&#10;print('Hello from Python!')"></textarea>
        </div>

        <!-- Split Output Panels -->
        <div class="output-container">
            <!-- Web Preview Panel (HTML/CSS/JS/PHP) -->
            <div class="output-panel web-preview-panel">
                <div class="panel-header">
                    <span>🌐 Live Web Preview</span>
                    <span class="status-indicator">Auto-updates on run</span>
                </div>
                <iframe id="preview-frame" title="Live Web Preview"></iframe>
            </div>

            <!-- Python Console Output Panel -->
            <div class="output-panel python-output-panel">
                <div class="panel-header">
                    <span>🐍 Python Output Console</span>
                    <button id="clear-python-out" class="btn-text">Clear Console</button>
                </div>
                <pre id="python-console" class="console-box">Ready to run Python code...</pre>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
