<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaduCode™ — Multi-Language Professional IDE</title>
    <!-- Pyodide for Python execution in browser -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <!-- sql.js for SQL execution in browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libsjs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent);
        }

        .toolbar {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.clear-btn {
            background-color: #475569;
        }
        button.clear-btn:hover {
            background-color: #334155;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            flex: 1;
            gap: 1px;
            background-color: var(--border-color);
            overflow: hidden;
        }

        .panel {
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            background-color: var(--bg-panel);
            padding: 8px 15px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .editor-container {
            flex: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: #090d16;
            color: #e2e8f0;
            border: none;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .console-output {
            flex: 1;
            background-color: #090d16;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.9rem;
            white-space: pre-wrap;
        }

        .console-output.error {
            color: var(--danger);
        }

        .console-output.success {
            color: var(--success);
        }

        table.sql-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        table.sql-table th, table.sql-table td {
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            text-align: left;
            font-size: 0.85rem;
        }

        table.sql-table th {
            background-color: var(--bg-panel);
            color: var(--text-main);
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>KuaduCode</span>™ Multi-Environment IDE</div>
        <div class="toolbar">
            <button class="clear-btn" onclick="clearAll()">Clear All</button>
            <button onclick="runAll()">▶ Run Web & Code</button>
        </div>
    </header>

    <div class="main-container">
        <!-- HTML / CSS / JS Editor Panel -->
        <div class="panel">
            <div class="panel-header">
                <span>HTML / CSS / JS Source</span>
            </div>
            <div class="editor-container">
                <textarea id="html-editor" placeholder="Write HTML/CSS/JS here...">&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;style&gt;
    body { font-family: sans-serif; text-align: center; padding-top: 40px; background: #f0fdf4; color: #166534; }
    h1 { font-size: 1.5rem; }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Hello from KuaduCode Live Preview!&lt;/h1&gt;
  &lt;p&gt;Edit code above to test live changes.&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>
            </div>
        </div>

        <!-- Live Preview Panel -->
        <div class="panel">
            <div class="panel-header">
                <span>Live Web View</span>
            </div>
            <iframe id="live-preview"></iframe>
        </div>

        <!-- Python Editor & Console Panel -->
        <div class="panel">
            <div class="panel-header">
                <span>Python 3 Workspace</span>
                <button style="padding: 2px 8px; font-size: 0.75rem;" onclick="runPython()">Run Python</button>
            </div>
            <div class="editor-container" style="display: flex; flex-direction: column;">
                <textarea id="python-editor" style="height: 50%;" placeholder="# Write Python code here...">import math

def calculate_circle(r):
    return math.pi * (r ** 2)

print("Radius 5 Area:", round(calculate_circle(5), 2))
print("Python environment ready!")</textarea>
                <div class="panel-header" style="border-top: 1px solid var(--border-color);">Python Console Output</div>
                <div id="python-console" class="console-output">Initializing Pyodide Python Engine...</div>
            </div>
        </div>

        <!-- SQL Editor & Console Panel -->
        <div class="panel">
            <div class="panel-header">
                <span>SQL Workspace (SQLite)</span>
                <button style="padding: 2px 8px; font-size: 0.75rem;" onclick="runSQL()">Run SQL</button>
            </div>
            <div class="editor-container" style="display: flex; flex-direction: column;">
                <textarea id="sql-editor" style="height: 50%;" placeholder="-- Write SQL queries here...">CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, role TEXT);
INSERT INTO users (name, role) VALUES ('Alice', 'Developer');
INSERT INTO users (name, role) VALUES ('Bob', 'Engineer');

SELECT * FROM users;</textarea>
                <div class="panel-header" style="border-top: 1px solid var(--border-color);">SQL Query Result</div>
                <div id="sql-console" class="console-output">Initializing SQL.js Engine...</div>
            </div>
        </div>
    </div>

    <script>
        // Live Preview Real-time updater
        const htmlEditor = document.getElementById('html-editor');
        const livePreview = document.getElementById('live-preview');

        function updatePreview() {
            const code = htmlEditor.value;
            const blob = new Blob([code], { type: 'text/html' });
            livePreview.src = URL.createObjectURL(blob);
        }

        htmlEditor.addEventListener('input', updatePreview);
        window.addEventListener('DOMContentLoaded', updatePreview);

        function runAll() {
            updatePreview();
            runPython();
            runSQL();
        }

        function clearAll() {
            if(confirm("Clear all editors?")) {
                document.getElementById('html-editor').value = "";
                document.getElementById('python-editor').value = "";
                document.getElementById('sql-editor').value = "";
                updatePreview();
                document.getElementById('python-console').innerText = "Cleared.";
                document.getElementById('sql-console').innerText = "Cleared.";
            }
        }

        // --- Python Engine Setup (Pyodide) ---
        let pyodideReady = false;
        let pyodideInstance = null;

        async function initPython() {
            const consoleEl = document.getElementById('python-console');
            try {
                pyodideInstance = await loadPyodide();
                pyodideReady = true;
                consoleEl.innerText = "Python Environment Ready. Click 'Run Python' to execute.";
            } catch (err) {
                consoleEl.className = "console-output error";
                consoleEl.innerText = "Failed to load Python environment: " + err.message;
            }
        }

        async function runPython() {
            const consoleEl = document.getElementById('python-console');
            if (!pyodideReady) {
                consoleEl.innerText = "Python is still initializing, please wait...";
                return;
            }

            consoleEl.className = "console-output";
            consoleEl.innerText = "Running...";

            let code = document.getElementById('python-editor').value;
            
            // Redirect stdout to capture prints
            let output = "";
            pyodideInstance.globals.set("print_to_console", (text) => {
                output += text + "\n";
            });

            try {
                // Intercept stdout
                pyodideInstance.runPython(`
                    import sys
                    import io
                    sys.stdout = io.StringIO()
                `);

                await pyodideInstance.loadPackagesFromImports(code);
                await pyodideInstance.runPythonAsync(code);

                let stdout = pyodideInstance.runPython("sys.stdout.getvalue()");
                consoleEl.innerText = stdout || "Executed successfully with no output.";
            } catch (err) {
                consoleEl.className = "console-output error";
                consoleEl.innerText = err.message;
            }
        }

        // --- SQL Engine Setup (sql.js) ---
        let db = null;

        async function initSQL() {
            const consoleEl = document.getElementById('sql-console');
            try {
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });
                db = new SQL.Database();
                consoleEl.innerText = "SQL Engine Ready. Click 'Run SQL' to execute queries.";
            } catch (err) {
                consoleEl.className = "console-output error";
                consoleEl.innerText = "Failed to load SQL engine: " + err.message;
            }
        }

        function runSQL() {
            const consoleEl = document.getElementById('sql-console');
            if (!db) {
                consoleEl.innerText = "SQL engine is still initializing...";
                return;
            }

            consoleEl.className = "console-output";
            const query = document.getElementById('sql-editor').value;

            try {
                // Exec can return multiple results if there are multiple statements
                const results = db.exec(query);
                if (results.length === 0) {
                    consoleEl.innerText = "Query executed successfully (No tabular output).";
                    return;
                }

                let htmlOutput = "";
                results.forEach(res => {
                    let table = '<table class="sql-table"><thead><tr>';
                    res.columns.forEach(col => {
                        table += `<th>${col}</th>`;
                    });
                    table += '</tr></thead><tbody>';

                    res.values.forEach(row => {
                        table += '<tr>';
                        row.forEach(val => {
                            table += `<td>${val !== null ? val : 'NULL'}</td>`;
                        });
                        table += '</tr>';
                    });
                    table += '</tbody></table>';
                    htmlOutput += table + "<br>";
                });

                consoleEl.innerHTML = htmlOutput;
            } catch (err) {
                consoleEl.className = "console-output error";
                consoleEl.innerText = err.message;
            }
        }

        // Initialize engines on load
        initPython();
        initSQL();
    </script>
</body>
</html>
