<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>Kuaducode Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');

:root {
--bg:#090e1c;
--panel:#111a2d;
--line:#25324b;
--text:#edf3ff;
--muted:#8e9bb4;
--accent:#8b7cff;
}

* {
box-sizing:border-box;
}

body {
margin:0;
min-height:100vh;
background:#090e1c;
color:var(--text);
font-family:Manrope,Arial,sans-serif;
}

.backdrop {
position:fixed;
inset:0;
z-index:-1;
background:linear-gradient(110deg,rgba(7,12,25,.96),rgba(8,14,29,.88)),url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=2000&q=85') center/cover no-repeat;
}

.app-shell {
max-width:1600px;
margin:auto;
padding:0 34px;
}

.topbar {
height:82px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid rgba(255,255,255,.1);
}

.brand {
display:flex;
align-items:center;
gap:10px;
color:white;
text-decoration:none;
font-size:21px;
font-weight:800;
}

.brand-mark {
display:grid;
place-items:center;
width:36px;
height:36px;
border-radius:11px;
background:linear-gradient(135deg,#8b7cff,#46d9d0);
color:#09101d;
}

.brand-accent {
color:#9c91ff;
}

.brand small {
font-size:9px;
letter-spacing:2px;
color:#8492ae;
}

.top-actions,.heading-actions {
display:flex;
align-items:center;
gap:14px;
}

.status {
font-size:12px;
color:#a7b3c9;
}

.status i,.live-dot {
display:inline-block;
width:7px;
height:7px;
border-radius:50%;
background:#4ee0a5;
margin-right:7px;
}

button {
font:600 12px Manrope;
cursor:pointer;
border:0;
}

.run-button {
padding:11px 17px;
border-radius:9px;
background:linear-gradient(120deg,#8b7cff,#5bcbce);
color:#08101e;
}

.run-button:hover {
filter:brightness(1.12);
}

.tabs {
display:flex;
gap:7px;
padding:22px 0 18px;
border-bottom:1px solid rgba(255,255,255,.09);
}

.tab {
padding:11px 17px;
border-radius:8px;
background:transparent;
color:#9ba8c0;
}

.tab.active {
background:#202a43;
color:white;
}

.panel {
display:none;
padding:26px 0 32px;
}

.panel.active {
display:block;
}

.workspace-heading {
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px;
}

.workspace-heading h1 {
font-size:22px;
margin:0 0 5px;
}

.workspace-heading p {
margin:0;
color:var(--muted);
font-size:12px;
}

.soft-button {
padding:10px 13px;
border-radius:8px;
background:#1a2540;
color:#c5d0e4;
border:1px solid #2a3856;
}

.web-layout {
display:grid;
grid-template-columns:minmax(420px,1fr) minmax(350px,1fr);
gap:16px;
min-height:610px;
}

.editors {
display:grid;
grid-template-rows:repeat(3,minmax(180px,1fr));
gap:12px;
min-height:610px;
}

.editor-card,.preview-card,.output-card,.console-card {
background:rgba(14,22,39,.96);
border:1px solid var(--line);
border-radius:12px;
overflow:hidden;
}

.editor-title,.preview-toolbar,.output-heading,.console-toolbar {
height:42px;
display:flex;
align-items:center;
padding:0 14px;
background:#151f35;
border-bottom:1px solid var(--line);
font-size:11px;
font-weight:700;
}

.language {
margin-left:auto;
font:10px 'DM Mono';
color:#7888a7;
}

.file-dot {
width:8px;
height:8px;
border-radius:50%;
display:inline-block;
margin-right:9px;
}

.html {background:#f08b5c;}
.css {background:#65a9ff;}
.js {background:#f0cf66;}
.py {background:#6fb8e9;}

textarea {
display:block;
width:100%;
height:calc(100% - 42px);
min-height:140px;
resize:none;
border:0;
outline:0;
background:#0c1425;
color:#d9e5fa;
padding:14px 16px;
font:12px/1.65 'DM Mono',monospace;
tab-size:4;
white-space:pre;
overflow:auto;
}

textarea:focus {
box-shadow:inset 0 0 0 1px
