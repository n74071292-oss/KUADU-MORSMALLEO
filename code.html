<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuaducode™ - World-Class Multi-Language IDE & AI Studio</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <style>
        :root {
            --bg-deep: #0f172a;
            --bg-panel: #1e293b;
            --bg-editor: #090d16;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --output-color: #38bdf8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--output-color);
            letter-spacing: 0.5px;
        }
        .toolbar {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .main-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 57px);
        }
        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            background-color: var(--bg-editor);
        }
        .pane-header {
            background-color: var(--bg-panel);
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        textarea {
            flex: 1;
            width: 100%;
            background-color: var(--bg-editor);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 16px;
            border: none;
            resize: none;
            outline: none;
            line-height: 1.5;
        }
        .preview-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-deep);
        }
        .preview-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            overflow-y: auto;
        }
        iframe {
            width: 100%;
            height: 50%;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }
        pre {
            flex: 1;
            background: var(--bg-editor);
            color: var(--output-color);
            font-family: 'Courier New', Courier, monospace;
            padding: 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            min-height: 120px;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Kuaducode™ IDE & AI Studio</div>
        <div class="toolbar">
            <button onclick="runPythonCode()">Run Python</button>
            <button onclick="refreshPreview()">Update WebView</button>
        </div>
    </header>

    <div class="main-layout">
        <div class="editor-pane">
            <div class="pane-header">Code Editor (HTML / Python Sandbox)</div>
            <textarea id="code-editor">
import js

name = js.prompt("Enter your full name:")
age = js.prompt("Enter your age:")
city = js.prompt("Enter your city/location:")
profession = js.prompt("Enter your profession:")

print("=== USER PROFILE SUMMARY ===")
print(f"Name      : {name}")
print(f"Age       : {age}")
print(f"City      : {city}")
print(f"Profession: {profession}")
            </textarea>
        </div>

        <div class="preview-pane">
            <div class="pane-header">Live WebView & Python Console</div>
            <div class="preview-container">
                <iframe id="web-preview" srcdoc="<h3>Live WebView Preview</h3><p>Run code or edit content to preview live output here.</p>"></iframe>
                <pre id="output-console">Initializing Pyodide environment...</pre>
            </div>
        </div>
    </div>

    <script>
        let pyodideReady = false;
        let pyodideInstance = null;

        async function initPyodide() {
            try {
                pyodideInstance = await loadPyodide();
                pyodideReady = true;
                document.getElementById("output-console").innerText = "Pyodide Ready. Click 'Run Python' to execute code.";
            } catch (err) {
                document.getElementById("output-console").innerText = "Error initializing Pyodide: " + err.message;
            }
        }

        initPyodide();

        async function runPythonCode() {
            const consoleBox = document.getElementById("output-console");
            if (!pyodideReady) {
                consoleBox.innerText = "Please wait, Pyodide is still loading...";
                return;
            }

            const codeText = document.getElementById("code-editor").value;
            consoleBox.innerText = "Executing...\n";

            pyodideInstance.setStdout({
                batched: (msg) => {
                    consoleBox.innerText += msg + "\n";
                }
            });

            try {
                await pyodideInstance.runPythonAsync(codeText);
            } catch (err) {
                consoleBox.innerText += "\nError: " + err.message;
            }
        }

        function refreshPreview() {
            const codeText = document.getElementById("code-editor").value;
            const iframe = document.getElementById("web-preview");
            iframe.srcdoc = codeText;
        }
    </script>
</body>
</html>
