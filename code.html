<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaduCode™ — Multi-Language Professional IDE</title>
    <!-- Pyodide for Python execution in browser -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <!-- sql.js for SQL execution in browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent);
        }

        .toolbar {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button.clear-btn {
            background-color: #475569;
        }
        button.clear-btn:hover {
            background-color: #334155;
        }

        /* Split main view into Left (Editors) and Right (Previews/Consoles) */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            gap: 1px;
            background-color: var(--border-color);
            overflow: hidden;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background-color: var(--border-color);
            height: 100%;
            overflow: hidden;
        }

        .panel {
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .panel-header {
            background-color: var(--bg-panel);
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .editor-container {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 100%;
            background-color: #090d16;
            color: #e2e8f0;
            border: none;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            line-height: 1.4;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .console-output {
            flex: 1;
            background-color: #090d16;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }

        .console-output.error {
            color: var(--danger);
        }

        table.sql-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        table.sql-table th, table.sql-table td {
            border: 1px solid var(--border-color);
            padding: 5px 8px;
            text-align: left;
            font-size: 0.8rem;
        }

        table.sql-table th {
            background-color: var(--bg-panel);
            color: var(--text-main);
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><span>KuaduCode</span>™ Professional IDE</div>
        <div class="toolbar">
            <button class="clear-btn" onclick="clearAll()">Clear All</button>
            <button onclick="runAll()">▶ Run Web & Code</button>
        </div>
    </header>

    <div class="main-container">
        <!-- LEFT COLUMN: Code Editors -->
        <div class="column">
            <!-- HTML / CSS / JS Editor Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span>HTML / CSS / JS Source</span>
                </div>
                <div class="editor-container">
                    <textarea id="html-editor" placeholder="Write HTML/CSS/JS here...">&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;style&gt;
    body { font-family: sans-serif; text-align: center; padding-top: 30px; background: #f0fdf4; color: #166534; }
    h1 { font-size: 1.3rem; }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;KuaduCode Live View Active!&lt;/h1&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>
                </div>
            </div>

            <!-- Python Editor Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span>Python 3 Workspace</span>
                    <button style="padding: 2px 8px; font-size: 0.75rem;" onclick="runPython()">Run Python</button>
                </div>
                <div class="editor-container">
                    <textarea id="python-editor" placeholder="# Write Python code here...">import math
print("Circle area r=4:", round(math.pi * 16, 2))</textarea>
                </div>
            </div>

            <!-- SQL Editor Panel -->
            <div class="panel">
                <div class="panel-header">
                    <span>SQL Workspace (SQLite)</span>
                    <button style="padding: 2px 8px; font-size: 0.75rem;" onclick="runSQL()">Run SQL</button>
                </div>
                <div class="editor-container">
                    <textarea id="sql-editor" placeholder="-- Write SQL queries here...">CREATE TABLE items (id INTEGER, name TEXT);
INSERT INTO items VALUES (1, 'Keyboard');
INSERT INTO items VALUES (2, 'Monitor');
SELECT * FROM items;</textarea>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Previews & Consoles -->
        <div class="column">
            <!-- Live Preview Panel -->
            <div class="panel" style="flex: 1.5;">
                <div class="panel-header">
                    <span>Live Web View</span>
                </div>
                <iframe id="live-preview"></iframe>
            </div>

            <!-- Python Output Panel -->
            <div class="panel" style="flex: 1;">
                <div class="panel-header">
                    <span>Python Console Output</span>
                </div>
                <div id="python-console" class="console-output">Initializing Pyodide...</div>
            </div>

            <!-- SQL Output Panel -->
            <div class="panel" style="flex: 1;">
                <div class="panel-header">
                    <span>SQL Query Result</span>
                </div>
                <div id="sql-console" class="console-output">Initializing SQL.js...</div>
            </div>
        </div>
    </div>

    <script>
        const htmlEditor = document.getElementById('html-editor');
        const livePreview = document.getElementById('live-preview');

        function updatePreview() {
            const code = htmlEditor.value;
            const blob = new Blob([code], { type: 'text/html' });
            livePreview.src = URL.createObjectURL(blob);
        }

        htmlEditor.addEventListener('input', updatePreview);
        window.addEventListener('DOMContentLoaded', updatePreview);

        function runAll() {
            updatePreview();
            runPython();
            runSQL();
        }

        function clearAll() {
            if(confirm("Clear all editors?")) {
                document.getElementById('html-editor').value = "";
                document.getElementById('python-editor').value = "";
                document.getElementById('sql-editor').value = "";
                updatePreview();
                document.getElementById('python-console').innerText = "Cleared.";
                document.getElementById('sql-console').innerText = "Cleared.";
            }
        }

        // --- Python Engine Setup ---
        let pyodideReady = false;
        let pyodideInstance = null;

        async function initPython() {
            const consoleEl = document.getElementById('python-console');
            try {
                pyodideInstance = await loadPyodide();
                pyodideReady = true;
                consoleEl.innerText = "Python Environment Ready.";
            } catch (err) {
                consoleEl.className = "console-output error";
                consoleEl.innerText = "Error loading Python: " + err.message;
            }
        }

        async function runPython() {
            const consoleEl = document.getElementById('python-console');
            if (!pyodideReady) {
                consoleEl.innerText = "Python is still initializing...";
                return;
            }

            consoleEl.className = "console-output";
            consoleEl.innerText = "Running...";
            let code = document.getElementById('python-editor').value;

            try {
                pyodideInstance.runPython(`
                    import sys
                    import io
                    sys.stdout = io.StringIO()
                `);

                await pyodideInstance.loadPackagesFromImports(code);
                await pyodideInstance.runPythonAsync(code);

                let stdout = pyodideInstance.runPython("sys.stdout.getvalue()");
                consoleEl.innerText = stdout || "Executed successfully with no output.";
            } catch (err) {
                consoleEl.className = "console-output error";
                consoleEl.innerText = err.message;
            }
        }

        // --- SQL Engine Setup ---
        let db = null;

        async function initSQL() {
            const consoleEl = document.getElementById('sql-console');
            try {
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });
                db = new SQL.Database();
                consoleEl.innerText = "SQL Engine Ready.";
            } catch (err) {
                consoleEl.className = "console-output error";
                consoleEl.innerText = "Error loading SQL: " + err.message;
            }
        }

        function runSQL() {
            const consoleEl = document.getElementById('sql-console');
            if (!db) {
                consoleEl.innerText = "SQL engine is still initializing...";
                return;
            }

            consoleEl.className = "console-output";
            const query = document.getElementById('sql-editor').value;

            try {
                const results = db.exec(query);
                if (results.length === 0) {
                    consoleEl.innerText = "Query executed successfully.";
                    return;
                }

                let htmlOutput = "";
                results.forEach(res => {
                    let table = '<table class="sql-table"><thead><tr>';
                    res.columns.forEach(col => table += `<th>${col}</th>`);
                    table += '</tr></thead><tbody>';

                    res.values.forEach(row => {
                        table += '<tr>';
                        row.forEach(val => table += `<td>${val !== null ? val : 'NULL'}</td>`);
                        table += '</tr>';
                    });
                    table += '</tbody></table>';
                    htmlOutput += table + "<br>";
                });

                consoleEl.innerHTML = htmlOutput;
            } catch (err) {
                consoleEl.className = "console-output error";
                consoleEl.innerText = err.message;
            }
        }

        initPython();
        initSQL();
    </script>
</body>
</html>
