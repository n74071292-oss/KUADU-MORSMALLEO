<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuadu AI — Intelligent Neural Coding Assistant</title>
    <style>
        :root {
            --bg-base: #06050b;
            --bg-surface: #0e0c19;
            --bg-elevated: #17142b;
            --border-color: #2e265c;
            --text-main: #f5f3ff;
            --text-muted: #9b93c9;
            --anime-cyan: #00f0ff;
            --anime-pink: #ff007f;
            --anime-purple: #9d00ff;
            --anime-green: #39ff14;
            --anime-yellow: #ffee00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: var(--anime-cyan);
            border-radius: 50%;
            animation: floatUp 7s infinite linear;
            opacity: 0.25;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        header, .ai-container {
            z-index: 1;
        }

        header {
            background-color: var(--bg-surface);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            box-shadow: 0 4px 25px rgba(157, 0, 255, 0.2);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            background: linear-gradient(135deg, var(--anime-cyan), var(--anime-pink));
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: white;
            font-size: 1.4rem;
            box-shadow: 0 0 15px var(--anime-pink);
            animation: neonPulse 2s infinite alternate;
        }

        @keyframes neonPulse {
            0% { box-shadow: 0 0 10px var(--anime-pink), inset 0 0 5px var(--anime-cyan); }
            100% { box-shadow: 0 0 25px var(--anime-cyan), inset 0 0 10px var(--anime-pink); }
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--anime-cyan), var(--anime-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .ai-status {
            font-size: 0.85rem;
            color: var(--anime-green);
            background: var(--bg-elevated);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--anime-green);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--anime-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--anime-green);
        }

        .ai-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 20px;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }

        .chat-box {
            flex: 1;
            background-color: var(--bg-surface);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .chat-msg {
            padding: 16px 20px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .chat-msg.user {
            background-color: var(--bg-elevated);
            align-self: flex-end;
            border: 1px solid var(--anime-pink);
            color: var(--text-main);
        }

        .chat-msg.assistant {
            background-color: #121022;
            align-self: flex-start;
            border: 1px solid var(--anime-cyan);
            color: var(--anime-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.05);
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .chat-input {
            flex: 1;
            background-color: var(--bg-surface);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .chat-input:focus {
            border-color: var(--anime-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--anime-cyan), var(--anime-purple));
            color: white;
            border: none;
            padding: 0 28px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
        }
    </style>
</head>
<body>

    <div class="particles" id="particles-container"></div>

    <header>
        <div class="brand">
            <div class="brand-logo">K</div>
            <h1>Kuadu AI Neural Agent</h1>
        </div>
        <div class="ai-status">
            <div class="status-dot"></div> Kuadu AI Core Online ⚡
        </div>
    </header>

    <div class="ai-container">
        <div class="chat-box" id="chat-history">
            <div class="chat-msg assistant">
                Konnichiwa! I am the standalone **Kuadu AI Agent**. Ask me any programming challenge, debugging query, or syntax problem, and I will analyze and solve it instantly! ⚡
            </div>
        </div>
        <div class="input-group">
            <input type="text" id="user-prompt" class="chat-input" placeholder="Ask Kuadu AI anything (e.g., 'How do I optimize a recursive function in Python?')..." onkeydown="if(event.key==='Enter') triggerKuaduAI()">
            <button class="send-btn" onclick="triggerKuaduAI()">Ask AI ⚡</button>
        </div>
    </div>

    <script>
        const particleContainer = document.getElementById('particles-container');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = `${Math.random() * 100}%`;
            p.style.width = `${Math.random() * 4 + 2}px`;
            p.style.height = p.style.width;
            p.style.animationDuration = `${Math.random() * 6 + 4}s`;
            p.style.animationDelay = `${Math.random() * 5}s`;
            particleContainer.appendChild(p);
        }

        async function triggerKuaduAI() {
            const inputField = document.getElementById('user-prompt');
            const chatHistory = document.getElementById('chat-history');
            const query = inputField.value.trim();
            if (!query) return;

            chatHistory.innerHTML += `<div class="chat-msg user">${query}</div>`;
            inputField.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            const loadingId = 'ai-load-' + Date.now();
            chatHistory.innerHTML += `<div class="chat-msg assistant" id="${loadingId}">Kuadu AI agent is analyzing your query across developer knowledge matrices... ⚡</div>`;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query + " programming guide code syntax")}&format=json`);
                const data = await response.json();

                let answer = "";
                if (data.AbstractText) {
                    answer = data.AbstractText;
                } else if (data.RelatedTopics && data.RelatedTopics.length > 0 && data.RelatedTopics[0].Text) {
                    answer = data.RelatedTopics[0].Text;
                } else {
                    answer = `Kuadu AI Agent Analysis for "${query}":\n\nTo implement this efficiently:\n1. Structure your data models cleanly.\n2. Handle edge cases with try/catch exception blocks.\n3. Test the code block inside your KuaduCode IDE compiler tab to verify output.`;
                }

                document.getElementById(loadingId).innerText = answer;
            } catch (err) {
                document.getElementById(loadingId).innerText = `Kuadu AI Neural Response:\n\nRegarding your query about "${query}", ensure your algorithm is optimized for performance, variables are scoped correctly, and syntax rules match your target programming language runtime.`;
            }
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>
</html>
