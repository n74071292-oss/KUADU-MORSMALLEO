<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>index.html - Kuaducode Studio Pro</title>
  <style>
    :root {
      --bg-main: #090d16;
      --bg-header: #0f172a;
      --bg-panel: #020617;
      --border-color: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      font-size: 13px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
    }

    .brand span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .run-btn {
      background: #10b981;
      color: #020617;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .run-btn:hover {
      background: #059669;
      color: #fff;
    }

    .status-badge {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 5px 10px;
      border-radius: 6px;
      color: #34d399;
      font-size: 12px;
    }

    .menu-bar {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 4px;
    }

    .menu-item-wrapper {
      position: relative;
      display: inline-block;
    }

    .menu-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }

    .menu-btn:hover, .menu-btn.active {
      background: #1e293b;
      color: var(--text-main);
    }

    .tools-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 230px;
      background: var(--bg-header);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      padding: 6px 0;
      margin-top: 4px;
    }

    .tools-dropdown.show {
      display: block;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 14px;
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }

    .dropdown-item:hover {
      background: #1e293b;
      color: var(--accent);
    }

    .dropdown-divider {
      height: 1px;
      background: var(--border-color);
      margin: 4px 0;
    }

    .tabs-bar {
      background: var(--bg-main);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding-left: 8px;
    }

    .file-tab {
      background: var(--bg-header);
      border-right: 1px solid var(--border-color);
      border-top: 2px solid var(--accent);
      padding: 8px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .file-tab span {
      color: var(--text-muted);
      cursor: pointer;
    }

    .file-tab span:hover {
      color: #f43f5e;
    }

    .new-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      padding: 6px 12px;
      cursor: pointer;
    }

    .new-tab-btn:hover {
      color: var(--text-main);
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    .editor-pane, .preview-pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      background: var(--bg-panel);
    }

    .pane-header {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      padding: 0 12px;
      font-size: 13px;
    }

    .pane-tab {
      padding: 8px 14px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
    }

    .pane-tab.active {
      color: var(--text-main);
      border-bottom-color: var(--accent);
      background: var(--bg-panel);
    }

    .editor-container {
      flex: 1;
      display: flex;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      overflow: auto;
    }

    .line-numbers {
      background: var(--bg-header);
      color: #475569;
      padding: 12px 8px;
      text-align: right;
      user-select: none;
      min-width: 40px;
      line-height: 1.5;
    }

    .code-textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: #e2e8f0;
      padding: 12px;
      font-family: inherit;
      font-size: inherit;
      line-height: 1.5;
      resize: none;
      outline: none;
      white-space: pre;
      overflow-wrap: normal;
    }

    .preview-frame {
      flex: 1;
      background: #ffffff;
      border: none;
      width: 100%;
      height: 100%;
    }

    .status-bar {
      background: var(--bg-header);
      border-top: 1px solid var(--border-color);
      padding: 4px 14px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .tool-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(4px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .tool-modal-overlay.open {
      display: flex;
    }

    .tool-modal {
      background: var(--bg-header);
      border: 1px solid #334155;
      border-radius: 10px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      color: var(--text-main);
    }

    .tool-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: #1e293b;
      border-bottom: 1px solid var(--border-color);
    }

    .tool-modal-title {
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
    }

    .tool-close-btn:hover {
      color: #f43f5e;
    }

    .tool-modal-body {
      padding: 20px;
    }

    .linux-terminal {
      background: #020617;
      color: #22c55e;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      padding: 14px;
      border-radius: 6px;
      height: 340px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
    }

    .term-line {
      margin-bottom: 6px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .term-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .term-prompt {
      color: var(--accent);
      font-weight: bold;
    }

    .term-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    .tool-btn {
      background: #10b981;
      color: #020617;
      font-weight: 600;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }

    .tool-btn:hover {
      background: #059669;
      color: #fff;
    }

    .tool-box {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      box-sizing: border-box;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">
      ⚡ <span>Kuaducode Studio Pro</span>
    </div>
    <div class="top-actions">
      <select id="langSelector" style="background:#1e293b; color:#fff; border:1px solid #334155; padding:5px 10px; border-radius:6px; font-size:12px;" onchange="updateLangLabel()">
        <option>HTML / CSS / JS</option>
        <option>Python Console</option>
        <option>JavaScript Console</option>
        <option>PHP Script</option>
        <option>SQL Query</option>
      </select>
      <button class="run-btn" onclick="runWorkspace()">▶ Run &amp; Output</button>
      <div class="status-badge">Kuaducode Workspace Active</div>
    </div>
  </div>

  <div class="menu-bar">
    <button class="menu-btn">File</button>
    <button class="menu-btn">Edit</button>
    <button class="menu-btn">Format</button>
    <button class="menu-btn">View</button>
    <button class="menu-btn">Help</button>

    <div class="menu-item-wrapper">
      <button class="menu-btn" id="toolsMenuBtn" onclick="toggleToolsMenu(event)">Tools ▾</button>
      <div class="tools-dropdown" id="toolsDropdown">
        <button class="dropdown-item" onclick="openTool('terminal')">🐧 Linux Terminal</button>
        <button class="dropdown-item" onclick="openTool('debugger')">🐞 Code Debugger</button>
        <button class="dropdown-item" onclick="openTool('password')">🔐 Password Generator</button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item" onclick="openTool('json')">📦 JSON Formatter &amp; Validator</button>
        <button class="dropdown-item" onclick="openTool('base64')">🔄 Base64 Encoder / Decoder</button>
      </div>
    </div>
  </div>

  <div class="tabs-bar">
    <div class="file-tab">index.html <span onclick="event.stopPropagation()">×</span></div>
    <button class="new-tab-btn">+</button>
  </div>

  <div class="workspace">
    <div class="editor-pane">
      <div class="pane-header">
        <div class="pane-tab active">Editor</div>
      </div>
      <div class="editor-container">
        <div class="line-numbers" id="lineNumbers">1</div>
        <textarea id="codeEditor" class="code-textarea" placeholder="Type your code here..." oninput="updateEditorStats()" onscroll="syncScroll()">&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;style&gt;
    body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f0fdf4; color: #166534; }
    h1 { font-size: 2.2rem; }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Hello from Kuaducode Studio Pro! 🚀&lt;/h1&gt;
  &lt;p&gt;Edit this code and click Run & Output.&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>
      </div>
    </div>

    <div class="preview-pane">
      <div class="pane-header">
        <div class="pane-tab active" id="previewTabName">Live HTML Preview</div>
      </div>
      <iframe id="previewFrame" class="preview-frame"></iframe>
    </div>
  </div>

  <div class="status-bar">
    <div id="cursorInfo">Zoom: 100% | Ln 1, Col 1</div>
    <div id="editorStats">Lang: HTML | Words: 38</div>
    <div>Kuaducode Engine</div>
  </div>

  <div class="tool-modal-overlay" id="toolModalOverlay" onclick="closeToolOutside(event)">
    <div class="tool-modal">
      <div class="tool-modal-header">
        <div class="tool-modal-title" id="toolModalTitle">Tool</div>
        <button class="tool-close-btn" onclick="closeTool()">✕</button>
      </div>
      <div class="tool-modal-body" id="toolModalBody"></div>
    </div>
  </div>

  <script>
    window.onload = () => {
      runWorkspace();
      updateEditorStats();
    };

    function toggleToolsMenu(e) {
      e.stopPropagation();
      const dropdown = document.getElementById('toolsDropdown');
      const btn = document.getElementById('toolsMenuBtn');
      dropdown.classList.toggle('show');
      btn.classList.toggle('active');
    }

    document.addEventListener('click', () => {
      document.getElementById('toolsDropdown')?.classList.remove('show');
      document.getElementById('toolsMenuBtn')?.classList.remove('active');
    });

    function closeTool() {
      document.getElementById('toolModalOverlay').classList.remove('open');
    }

    function closeToolOutside(e) {
      if (e.target.id === 'toolModalOverlay') closeTool();
    }

    function runWorkspace() {
      const code = document.getElementById('codeEditor').value;
      const iframe = document.getElementById('previewFrame');
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      doc.open();
      doc.write(code);
      doc.close();
    }

    function updateEditorStats() {
      const textarea = document.getElementById('codeEditor');
      const lines = textarea.value.split('\n').length;
      let lineNumHTML = '';
      for (let i = 1; i <= lines; i++) {
        lineNumHTML += i + '<br>';
      }
      document.getElementById('lineNumbers').innerHTML = lineNumHTML;

      const words = textarea.value.trim() ? textarea.value.trim().split(/\s+/).length : 0;
      const lang = document.getElementById('langSelector').value;
      document.getElementById('editorStats').textContent = `Lang: ${lang.split(' ')[0]} | Words: ${words}`;
    }

    function syncScroll() {
      const textarea = document.getElementById('codeEditor');
      const lineNums = document.getElementById('lineNumbers');
      lineNums.scrollTop = textarea.scrollTop;
    }

    function updateLangLabel() {
      updateEditorStats();
    }

    const virtualFS = {
      'index.html': '<!DOCTYPE html><html><body><h1>Kuaducode Workspace</h1></body></html>',
      'README.md': '# Kuaducode Studio Pro\nBuilt-in Linux Environment v1.0',
      'script.js': 'console.log("Kuaducode Engine Ready");'
    };

    function openTool(toolName) {
      const overlay = document.getElementById('toolModalOverlay');
      const title = document.getElementById('toolModalTitle');
      const body = document.getElementById('toolModalBody');

      if (toolName === 'terminal') {
        title.innerHTML = '🐧 KuaduOS Linux Terminal (bash)';
        body.innerHTML = `
          <div class="linux-terminal" id="linuxTerminal" onclick="document.getElementById('termInput').focus()">
            <div class="term-line">Welcome to Kuaducode Linux Kernel 6.8.0-kuadu (x86_64)</div>
            <div class="term-line">Type <b>help</b> to see available commands.</div>
            <div id="termOutput"></div>
            <div class="term-input-row">
              <span class="term-prompt">kuadu@studio:~/workspace$</span>
              <input type="text" id="termInput" class="term-input" autocomplete="off" onkeydown="handleTerminalCmd(event)" />
            </div>
          </div>
        `;
        overlay.classList.add('open');
        setTimeout(() => document.getElementById('termInput').focus(), 50);
      }

      else if (toolName === 'debugger') {
        title.innerHTML = '🐞 Smart Code Debugger';
        body.innerHTML = `
          <p style="font-size:13px; color:var(--text-muted); margin-top:0;">Scans your active editor code for syntax mismatches, unclosed brackets, and common bugs.</p>
          <button class="tool-btn" onclick="runCodeDebugger()">▶ Scan Active Editor Code</button>
          <div id="debugResults" class="tool-box" style="margin-top:12px; min-height:140px; white-space:pre-wrap;">Click "Scan Active Editor Code" to inspect...</div>
        `;
        overlay.classList.add('open');
      }

      else if (toolName === 'password') {
        title.innerHTML = '🔐 Cryptographic Password Generator';
        body.innerHTML = `
          <div style="display:flex; gap:10px; margin-bottom:12px;">
            <input type="text" id="genPassOutput" class="tool-box" readonly value="Click Generate..." />
            <button class="tool-btn" onclick="copyGeneratedPass()">Copy</button>
          </div>
          <div style="display:flex; align-items:center; gap:15px; font-size:13px; margin-bottom:14px;">
            <label>Length: <input type="number" id="passLen" value="16" min="6" max="64" style="width:55px; background:#020617; color:#fff; border:1px solid #334155; padding:4px; border-radius:4px;"></label>
            <label><input type="checkbox" id="passSymbols" checked> Symbols (!@#$)</label>
            <label><input type="checkbox" id="passNumbers" checked> Numbers (0-9)</label>
          </div>
          <button class="tool-btn" onclick="generatePassword()">⚡ Generate Strong Password</button>
        `;
        overlay.classList.add('open');
        generatePassword();
      }

      else if (toolName === 'json') {
        title.innerHTML = '📦 JSON Formatter & Validator';
        body.innerHTML = `
          <textarea id="jsonInput" class="tool-box" rows="8" placeholder='{"project":"Kuaducode","pro":true}'></textarea>
          <div style="margin-top:10px; display:flex; gap:10px;">
            <button class="tool-btn" onclick="formatJSON(2)">Beautify JSON</button>
            <button class="tool-btn" style="background:#38bdf8;" onclick="formatJSON(0)">Minify JSON</button>
          </div>
          <div id="jsonStatus" style="margin-top:8px; font-size:12px; color:var(--text-muted);"></div>
        `;
        overlay.classList.add('open');
      }

      else if (toolName === 'base64') {
        title.innerHTML = '🔄 Base64 Encoder / Decoder';
        body.innerHTML = `
          <textarea id="b64Input" class="tool-box" rows="5" placeholder="Enter text or Base64 string..."></textarea>
          <div style="margin:10px 0; display:flex; gap:10px;">
            <button class="tool-btn" onclick="runBase64('encode')">Encode to Base64</button>
            <button class="tool-btn" style="background:#38bdf8;" onclick="runBase64('decode')">Decode from Base64</button>
          </div>
          <textarea id="b64Output" class="tool-box" rows="5" readonly placeholder="Result..."></textarea>
        `;
        overlay.classList.add('open');
      }
    }

    function handleTerminalCmd(e) {
      if (e.key !== 'Enter') return;
      const input = document.getElementById('termInput');
      const output = document.getElementById('termOutput');
      const rawCmd = input.value.trim();
      input.value = '';

      const line = document.createElement('div');
      line.className = 'term-line';
      line.innerHTML = `<span class="term-prompt">kuadu@studio:~/workspace$</span> ${rawCmd}`;
      output.appendChild(line);

      if (!rawCmd) return;

      const args = rawCmd.split(' ');
      const cmd = args[0].toLowerCase();
      let response = '';

      switch (cmd) {
        case 'help':
          response = 'Available commands: ls, pwd, whoami, date, uname, cat <file>, touch <file>, rm <file>, echo <text>, clear';
          break;
        case 'ls':
          response = Object.keys(virtualFS).join('   ');
          break;
        case 'pwd':
          response = '/home/kuadu/workspace';
          break;
        case 'whoami':
          response = 'kuadu-developer';
          break;
        case 'date':
          response = new Date().toString();
          break;
        case 'uname':
          response = 'Linux kuaducode-vm 6.8.0-generic #1 SMP x86_64 GNU/Linux';
          break;
        case 'touch':
          if (!args[1]) response = 'touch: missing file operand';
          else { virtualFS[args[1]] = ''; response = `Created file: ${args[1]}`; }
          break;
        case 'rm':
          if (!args[1] || !(args[1] in virtualFS)) response = `rm: cannot remove '${args[1] || ''}': No such file`;
          else { delete virtualFS[args[1]]; response = `Removed ${args[1]}`; }
          break;
        case 'cat':
          if (!args[1] || !(args[1] in virtualFS)) response = `cat: ${args[1] || ''}: No such file or directory`;
          else response = virtualFS[args[1]] || '(empty file)';
          break;
        case 'echo':
          response = args.slice(1).join(' ');
          break;
        case 'clear':
          output.innerHTML = '';
          return;
        default:
          response = `bash: ${cmd}: command not found`;
      }

      const resLine = document.createElement('div');
      resLine.className = 'term-line';
      resLine.style.color = '#cbd5e1';
      resLine.textContent = response;
      output.appendChild(resLine);

      const term = document.getElementById('linuxTerminal');
      term.scrollTop = term.scrollHeight;
    }

    function runCodeDebugger() {
      const code = document.getElementById('codeEditor').value;
      const resultsEl = document.getElementById('debugResults');

      if (!code.trim()) {
        resultsEl.style.color = '#fbbf24';
        resultsEl.textContent = '⚠️ Editor is currently empty. Write some code first!';
        return;
      }

      const issues = [];
      const lines = code.split('\n');

      const pairs = { '(': ')', '{': '}', '[': ']' };
      const stack = [];
      for (let i = 0; i < code.length; i++) {
        const ch = code[i];
        if (pairs[ch]) stack.push(ch);
        else if (Object.values(pairs).includes(ch)) {
          const last = stack.pop();
          if (pairs[last] !== ch) issues.push(`❌ Mismatched closing bracket '${ch}' found.`);
        }
      }
      if (stack.length > 0) issues.push(`❌ Unclosed bracket(s) remaining: ${stack.join(', ')}`);

      lines.forEach((line, idx) => {
        if (line.includes('console.log(')) issues.push(`ℹ️ Line ${idx + 1}: Active console.log() statement found.`);
        if (line.includes('var ')) issues.push(`⚠️ Line ${idx + 1}: Legacy 'var' keyword used (consider 'let' or 'const').`);
        if (line.includes('==') && !line.includes('===')) issues.push(`⚠️ Line ${idx + 1}: Loose equality '==' detected.`);
      });

      if (issues.length === 0) {
        resultsEl.style.color = '#22c55e';
        resultsEl.textContent = `✅ No syntax or lint issues found across ${lines.length} line(s)!`;
      } else {
        resultsEl.style.color = '#f87171';
        resultsEl.textContent = issues.join('\n');
      }
    }

    function generatePassword() {
      const len = parseInt(document.getElementById('passLen').value) || 16;
      const useSym = document.getElementById('passSymbols').checked;
      const useNum = document.getElementById('passNumbers').checked;

      let chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (useNum) chars += '0123456789';
      if (useSym) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

      const array = new Uint32Array(len);
      crypto.getRandomValues(array);
      let pass = '';
      for (let i = 0; i < len; i++) {
        pass += chars[array[i] % chars.length];
      }
      document.getElementById('genPassOutput').value = pass;
    }

    function copyGeneratedPass() {
      const el = document.getElementById('genPassOutput');
      el.select();
      navigator.clipboard.writeText(el.value);
    }

    function formatJSON(spaces) {
      const input = document.getElementById('jsonInput');
      const status = document.getElementById('jsonStatus');
      try {
        const parsed = JSON.parse(input.value);
        input.value = JSON.stringify(parsed, null, spaces);
        status.style.color = '#22c55e';
        status.textContent = '✅ Valid JSON formatted successfully.';
      } catch (err) {
        status.style.color = '#f43f5e';
        status.textContent = `❌ Invalid JSON: ${err.message}`;
      }
    }

    function runBase64(mode) {
      const input = document.getElementById('b64Input').value;
      const output = document.getElementById('b64Output');
      try {
        output.value = mode === 'encode' ? btoa(input) : atob(input);
      } catch (e) {
        output.value = 'Error: Invalid input for Base64 conversion.';
      }
    }
  </script>
</body>
</html>
