<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuaduCode Multi-Language Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #252526;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 1.1rem;
            color: #4ec9b0;
        }

        .lang-tabs {
            display: flex;
            background-color: #2d2d2d;
            padding: 8px 12px;
            gap: 6px;
            overflow-x: auto;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: #333;
            color: #9cdcfe;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background-color: #3e3e42;
        }

        .tab-btn.active {
            background-color: #007acc;
            color: #ffffff;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            flex: 1;
            background-color: #333;
            gap: 5px;
            padding: 5px;
            overflow: hidden;
        }

        .pane {
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
            border-radius: 4px;
            overflow: hidden;
        }

        .pane-header {
            background-color: #2d2d2d;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #4ec9b0;
        }

        .run-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 3px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .run-btn:hover {
            background-color: #218838;
        }

        textarea {
            flex: 1;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 12px;
            resize: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            outline: none;
            line-height: 1.4;
            tab-size: 4;
        }

        .output-container {
            flex: 1;
            background-color: #111;
            color: #ce9178;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        iframe {
            flex: 1;
            border: none;
            background-color: #ffffff;
        }

        @media(max-width: 768px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ KuaduCode Expanded Multi-Language Editor</h1>
    </header>

    <!-- Language Selector Tabs -->
    <div class="lang-tabs">
        <button class="tab-btn active" onclick="switchLanguage('web')">Web (HTML/CSS/JS)</button>
        <button class="tab-btn" onclick="switchLanguage('python')">Python</button>
        <button class="tab-btn" onclick="switchLanguage('java')">Java</button>
        <button class="tab-btn" onclick="switchLanguage('cpp')">C++</button>
        <button class="tab-btn" onclick="switchLanguage('csharp')">C#</button>
        <button class="tab-btn" onclick="switchLanguage('go')">Go</button>
        <button class="tab-btn" onclick="switchLanguage('typescript')">TypeScript</button>
        <button class="tab-btn" onclick="switchLanguage('swift')">Swift</button>
        <button class="tab-btn" onclick="switchLanguage('kotlin')">Kotlin</button>
        <button class="tab-btn" onclick="switchLanguage('sql')">SQL</button>
        <button class="tab-btn" onclick="switchLanguage('r')">R</button>
    </div>

    <!-- Workspace Container -->
    <div class="workspace" id="editor-workspace"></div>

    <script>
        const templates = {
            web: {
                html: '<h1>Hello Web Developer!</h1>\n<p>Edit HTML, CSS, or JS to see live updates.</p>',
                css: 'body { font-family: sans-serif; text-align: center; margin-top: 40px; color: #333; }',
                js: 'console.log("Web console ready!");'
            },
            python: `# Python Starter Code\ndef start_journey():\n    dream = "developer"\n    print(f"Your coding journey starts here! Dream: {dream}")\n\nstart_journey()`,
            java: `// Java Starter Code\npublic class Main {\n    public static void main(String[] args) {\n        String dream = "developer";\n        System.out.println("Hello, Java! Your dream: " + dream);\n    }\n}`,
            cpp: `// C++ Starter Code\n#include <iostream>\nusing namespace std;\n\nint main() {\n    string dream = "developer";\n    cout << "Hello C++! Your dream: " << dream << endl;\n    return 0;\n}`,
            csharp: `// C# Starter Code\nusing System;\n\nclass Program {\n    static void Main() {\n        string dream = "developer";\n        Console.WriteLine("Hello C#! Your dream: " + dream);\n    }\n}`,
            go: `// Go Starter Code\npackage main\nimport "fmt"\n\nfunc main() {\n    dream := "developer"\n    fmt.Printf("Hello Go! Your dream: %s\\n", dream)\n}`,
            typescript: `// TypeScript Starter Code\ninterface User {\n    name: string;\n    dream: string;\n}\n\nconst coder: User = { name: "Learner", dream: "developer" };\nconsole.log(\`Hello TypeScript! \${coder.name}'s dream: \${coder.dream}\`);`,
            swift: `// Swift Starter Code\nlet dream = "developer"\nprint("Hello Swift! Your dream: \\(dream)")`,
            kotlin: `// Kotlin Starter Code\nfun main() {\n    val dream = "developer"\n    println("Hello Kotlin! Your dream: $dream")\n}`,
            sql: `-- SQL Starter Code\nCREATE TABLE learners (id INT, name TEXT, dream TEXT);\nINSERT INTO learners VALUES (1, 'Alice', 'developer');\nSELECT * FROM learners;`,
            r: `# R Starter Code\ndream <- "developer"\ncat("Hello R! Your dream:", dream, "\\n")`
        };

        let currentLang = 'web';

        function switchLanguage(lang) {
            currentLang = lang;
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const workspace = document.getElementById('editor-workspace');

            if (lang === 'web') {
                workspace.innerHTML = `
                    <div class="pane">
                        <div class="pane-header">&lt;/&gt; HTML / CSS / JS Editor</div>
                        <textarea id="web-code" placeholder="Write code...">${templates.web.html}\n\n<style>${templates.web.css}</style>\n\n<script>${templates.web.js}<\/script></textarea>
                    </div>
                    <div class="pane">
                        <div class="pane-header">👁 Live Preview</div>
                        <iframe id="output-frame"></iframe>
                    </div>
                `;
                document.getElementById('web-code').addEventListener('input', updateWebPreview);
                updateWebPreview();
            } else {
                workspace.innerHTML = `
                    <div class="pane">
                        <div class="pane-header">
                            <span>💻 ${lang.toUpperCase()} Editor</span>
                            <button class="run-btn" onclick="runCode()">▶ Run / Test</button>
                        </div>
                        <textarea id="code-input">${templates[lang]}</textarea>
                    </div>
                    <div class="pane">
                        <div class="pane-header">📤 Execution Output</div>
                        <div class="output-container" id="output-console">Click 'Run / Test' to simulate code execution...</div>
                    </div>
                `;
            }
        }

        function updateWebPreview() {
            const code = document.getElementById('web-code').value;
            const frame = document.getElementById('output-frame');
            const doc = frame.contentDocument || frame.contentWindow.document;
            doc.open();
            doc.write(code);
            doc.close();
        }

        function runCode() {
            const consoleBox = document.getElementById('output-console');
            consoleBox.innerHTML = `Compiling and executing ${currentLang.toUpperCase()}...\n\n`;
            
            setTimeout(() => {
                const outputs = {
                    python: "Your coding journey starts here! Dream: developer\n[Process completed successfully]",
                    java: "Hello, Java! Your dream: developer\n[Build successful]",
                    cpp: "Hello C++! Your dream: developer\n[Exited with code 0]",
                    csharp: "Hello C#! Your dream: developer\n[Execution completed]",
                    go: "Hello Go! Your dream: developer\n[Process finished]",
                    typescript: "Hello TypeScript! Learner's dream: developer\n[TS Compiled & Executed]",
                    swift: "Hello Swift! Your dream: developer\n[Execution finished]",
                    kotlin: "Hello Kotlin! Your dream: developer\n[Compilation successful]",
                    sql: "id | name  | dream    \n---|-------|----------\n 1 | Alice | developer\n[Query executed successfully (1 row)]",
                    r: "Hello R! Your dream: developer \n[Execution finished]"
                };
                consoleBox.innerHTML += outputs[currentLang] || "Output generated successfully.";
            }, 400);
        }

        // Initialize with Web view on load
        switchLanguage('web');
    </script>
</body>
</html>
