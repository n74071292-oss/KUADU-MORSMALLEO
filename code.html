<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuaducode™ - World-Class Multi-Language IDE & AI Studio</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        :root {
            --bg-deep: rgba(241, 245, 249, 0.85);
            --bg-dark: rgba(255, 255, 255, 0.94);
            --bg-panel: rgba(248, 250, 252, 0.96);
            --border-color: #cbd5e1;
            --text-main: #0f172a;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-deep);
            color: var(--text-main);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-dark);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        textarea {
            width: 100%;
            height: 150px;
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        pre {
            background: #1e293b;
            color: #38bdf8;
            padding: 15px;
            border-radius: 4px;
            min-height: 80px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Kuaducode Python Runner</h2>
        <p>Write your Python code below:</p>
        
        <textarea id="python-code">
import js

name = js.prompt("Enter your full name:")
age = js.prompt("Enter your age:")
city = js.prompt("Enter your city/location:")
profession = js.prompt("Enter your profession:")

print("=== USER PROFILE SUMMARY ===")
print(f"Name      : {name}")
print(f"Age       : {age}")
print(f"City      : {city}")
print(f"Profession: {profession}")
        </textarea>
        <br>
        <button onclick="runPython()">Run Python Code</button>

        <h3>Console Output:</h3>
        <pre id="output">Initializing Pyodide...</pre>
    </div>

    <script>
        let pyodideReady = false;
        let pyodideInstance = null;

        async function loadPyodideEnvironment() {
            try {
                pyodideInstance = await loadPyodide();
                pyodideReady = true;
                document.getElementById("output").innerText = "Pyodide Ready. Click 'Run Python Code' to start.";
            } catch (err) {
                document.getElementById("output").innerText = "Error loading Pyodide: " + err.message;
            }
        }

        loadPyodideEnvironment();

        async function runPython() {
            const outputElement = document.getElementById("output");
            if (!pyodideReady) {
                outputElement.innerText = "Please wait, Pyodide is still loading...";
                return;
            }

            const code = document.getElementById("python-code").value;
            outputElement.innerText = "Running...\n";

            pyodideInstance.setStdout({
                batched: (msg) => {
                    outputElement.innerText += msg + "\n";
                }
            });

            try {
                await pyodideInstance.runPythonAsync(code);
            } catch (err) {
                outputElement.innerText += "\nError: " + err.message;
            }
        }
    </script>
</body>
</html>
