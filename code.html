<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuaducode - IDE & AI Studio</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <style>
        :root {
            --bg-overlay: rgba(15, 23, 42, 0.90);
            --bg-panel: rgba(30, 41, 59, 0.95);
            --bg-editor: #090d16;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --output-color: #38bdf8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-overlay);
            z-index: -1;
        }
        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--output-color);
            letter-spacing: 0.5px;
        }
        .toolbar {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .main-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 57px);
        }
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            background-color: var(--bg-editor);
            display: none;
        }
        .pane.active-pane {
            display: flex;
        }
        .tab-bar {
            background-color: var(--bg-panel);
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }
        .tab {
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-right: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tab.active {
            color: var(--text-main);
            background-color: var(--bg-editor);
            border-bottom: 2px solid var(--accent-blue);
        }
        textarea {
            flex: 1;
            width: 100%;
            background-color: var(--bg-editor);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 16px;
            border: none;
            resize: none;
            outline: none;
            line-height: 1.5;
        }
        .preview-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: rgba(9, 13, 22, 0.85);
        }
        iframe {
            flex: 1;
            width: 100%;
            background: white;
            border: none;
        }
        pre {
            background: var(--bg-editor);
            color: var(--output-color);
            font-family: 'Courier New', Courier, monospace;
            padding: 16px;
            border-top: 1px solid var(--border-color);
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="backdrop"></div>

    <header>
        <div class="logo">Kuaducode</div>
        <div class="toolbar">
            <button onclick="runPythonCode()">Run Python</button>
            <button onclick="refreshWebView()">Update Web Preview</button>
        </div>
    </header>

    <div class="main-layout">
        <div id="python-pane" class="pane active-pane">
            <div class="tab-bar">
                <div class="tab active" onclick="switchTab('python')">Python Workspace</div>
            </div>
            <textarea id="python-editor">import js

name = js.prompt("Enter your full name:")
age = js.prompt("Enter your age:")

print("=== KUADUCODE PYTHON EXECUTION ===")
print(f"Developer Name: {name}")
print(f"Age: {age}")</textarea>
            <pre id="output-console">Initializing Pyodide environment...</pre>
        </div>

        <div id="html-pane" class="pane">
            <div class="tab-bar">
                <div class="tab active" onclick="switchTab('html')">HTML Workspace</div>
            </div>
            <textarea id="html-editor"><!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f0fdf4; color: #166534; }
        h1 { font-size: 2.5rem; }
    </style>
</head>
<body>
    <h1>Welcome to Kuaducode Live View!</h1>
    <p>Edit your HTML code in the HTML tab and click 'Update Web Preview'.</p>
</body>
</html></textarea>
        </div>

        <div id="preview-pane" class="pane">
            <div class="tab-bar">
                <div class="tab active" onclick="switchTab('preview')">Live Web Preview</div>
            </div>
            <div class="preview-wrapper">
                <iframe id="web-preview"></iframe>
            </div>
        </div>
    </div>

    <script>
        let pyodideReady = false;
        let pyodideInstance = null;

        async function initPyodide() {
            try {
                pyodideInstance = await loadPyodide();
                pyodideReady = true;
                document.getElementById("output-console").innerText = "Pyodide Ready. Click 'Run Python' to execute code.";
            } catch (err) {
                document.getElementById("output-console").innerText = "Error initializing Pyodide: " + err.message;
            }
        }

        initPyodide();

        async function runPythonCode() {
            switchTab('python');
            const consoleBox = document.getElementById("output-console");
            if (!pyodideReady) {
                consoleBox.innerText = "Please wait, Pyodide is still loading...";
                return;
            }

            const codeText = document.getElementById("python-editor").value;
            consoleBox.innerText = "Executing Python...\n";

            pyodideInstance.setStdout({
                batched: (msg) => {
                    consoleBox.innerText += msg + "\n";
                }
            });

            try {
                await pyodideInstance.runPythonAsync(codeText);
            } catch (err) {
                consoleBox.innerText += "\nError: " + err.message;
            }
        }

        function refreshWebView() {
            const codeText = document.getElementById("html-editor").value;
            const iframe = document.getElementById("web-preview");
            iframe.srcdoc = codeText;
            switchTab('preview');
        }

        function switchTab(targetName) {
            document.getElementById('python-pane').classList.remove('active-pane');
            document.getElementById('html-pane').classList.remove('active-pane');
            document.getElementById('preview-pane').classList.remove('active-pane');

            if (targetName === 'python') {
                document.getElementById('python-pane').classList.add('active-pane');
            } else if (targetName === 'html') {
                document.getElementById('html-pane').classList.add('active-pane');
            } else if (targetName === 'preview') {
                document.getElementById('preview-pane').classList.add('active-pane');
            }
        }

        refreshWebView();
    </script>
</body>
</html>
